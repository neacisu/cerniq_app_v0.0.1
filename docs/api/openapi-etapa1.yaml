                $ref: "#/components/schemas/SuccessObjectResponse"

  /imports/{importId}/reprocess-errors:
    get:
      tags: [Imports]
      operationId: getImportErrors
      summary: Listeaza inregistrarile cu erori pentru reprocessare
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ImportIdParam"
        - name: limit
          in: query
          schema:
            type: integer
            default: 25
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: Lista erori
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessListResponse"

  /imports/{importId}/retry:
    post:
      tags: [Imports]
      operationId: retryImport
      summary: Retrimite un import eșuat
      description: |
        Repornește procesarea unui import eșuat sau anulat.
        Poate primi opțional un nou mapping de coloane.
        Nu se poate retrimite un import deja în procesare sau completat.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ImportIdParam"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
