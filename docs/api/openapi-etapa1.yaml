      parameters:
        - $ref: "#/components/parameters/ImportIdParam"
        - name: limit
          in: query
          schema:
            type: integer
            default: 25
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: Entitati create
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessListResponse"

  # ==================== APPROVALS EXTENDED ====================
  /enrichment/approvals/stats:
    get:
      tags: [Approvals]
      operationId: getApprovalStats
      summary: Statistici HITL approvals (count per tip/status)
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Statistici approvals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessObjectResponse"

  # ==================== IMPORTS EXTENDED (batch 2) ====================
  /imports/{importId}/re-promote:
    post:
      tags: [Imports]
      operationId: rePromoteImport
      summary: Re-promovează toate contactele din import (Bronze -> Silver)
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ImportIdParam"
      responses:
        "200":
          description: Re-promovare pornită
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessObjectResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /imports/{importId}/resume-promote:
    post:
      tags: [Imports]
