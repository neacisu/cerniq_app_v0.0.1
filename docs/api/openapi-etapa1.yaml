openapi: 3.1.0
info:
  title: Cerniq.app API — Etapa 1 (Data Enrichment)
  version: 1.0.0
  description: |
    Specificație OpenAPI pentru Etapa 1 - Data Enrichment Pipeline.

    ## Overview
    Etapa 1 implementează pipeline-ul de îmbogățire date pentru prospecți B2B:
    - **Bronze Layer**: Ingestie și validare date brute (CSV, Excel, API, Webhook)
    - **Silver Layer**: Îmbogățire date (ANAF, Termene.ro, ONRC, Geocoding)
    - **Gold Layer**: Lead-uri calificate pentru outreach
    - **HITL**: Human-in-the-Loop pentru aprobare date incerte

    ## Autentificare
    Toate endpoint-urile necesită autentificare JWT:
    ```
    Authorization: Bearer <access_token>
    X-Tenant-ID: <tenant_uuid>
    ```

    ## Rate Limiting
    - Standard: 100 req/min
    - Import: 10 req/min
    - Enrichment: 60 req/min

    Pentru schema globală și convenții comune, vezi docs/api/openapi.yaml.
  contact:
    name: Cerniq Development Team
    email: dev@cerniq.app
  license:
    name: Proprietary
    url: https://cerniq.app/license
servers:
  - url: https://api.cerniq.app/api/v1
    description: Production
  - url: https://staging.cerniq.app/api/v1
    description: Staging
  - url: http://localhost:64000/api/v1
    description: Development

tags:
  - name: Dashboard
    description: Dashboard și statistici generale
  - name: Imports
    description: Import date din CSV, Excel, API
  - name: Bronze
    description: Bronze layer - date brute
  - name: Silver
    description: Silver layer - date îmbogățite
  - name: Gold
    description: Gold layer - lead-uri calificate
  - name: Approvals
    description: HITL approval system
  - name: Enrichment
    description: Queue-uri și status îmbogățire

paths:
  # ==================== DASHBOARD ====================
  /dashboard/stats:
    get:
      tags: [Dashboard]
      operationId: getDashboardStats
      summary: Obține statistici generale dashboard
      description: |
        Returnează statistici agregate pentru toate layerele:
        - Bronze: total, pending, promoted, rejected
        - Silver: validated, enriched, eligible
        - Gold: promoted leads
        - Approvals: pending, urgent
        - Quality: average score, distribution
        - Enrichment: queue depths
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Statistici dashboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStatsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /dashboard/activity:
    get:
      tags: [Dashboard]
      operationId: getDashboardActivity
      summary: Obține activitatea recentă
      description: Feed de activitate cu evenimente recente (import-uri, aprobări, erori)
      security:
        - BearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
          description: Număr maxim de activități returnate
      responses:
        "200":
          description: Lista de activități
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityListResponse"

  # ==================== IMPORTS ====================
  /imports:
    get:
      tags: [Imports]
      operationId: listImports
      summary: Listează import batches
      description: |
        Listează toate batch-urile de import cu paginare și filtrare.
        Suportă filtrare după status, source type, și interval de date.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/LimitParam"
        - $ref: "#/components/parameters/OffsetParam"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/ImportStatus"
        - name: sourceType
          in: query
          schema:
            $ref: "#/components/schemas/ImportSourceType"
        - name: dateFrom
          in: query
          schema:
            type: string
            format: date-time
          description: Data de început pentru filtrare
        - name: dateTo
          in: query
          schema:
            type: string
            format: date-time
          description: Data de sfârșit pentru filtrare
        - name: sortBy
          in: query
          schema:
            type: string
            enum: [createdAt, updatedAt]
            default: createdAt
        - name: sortDir
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
        "200":
          description: Lista de import batches
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportListResponse"

    post:
      tags: [Imports]
      operationId: createImport
      summary: Creează un import nou
      description: |
        Upload fișier CSV sau Excel pentru import.
        Procesarea se face asincron, statusul poate fi verificat via GET /imports/:id.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: Fișier CSV sau Excel (.csv, .xlsx, .xls)
                mapping:
                  type: string
                  description: JSON string cu maparea coloanelor
                hasHeader:
                  type: boolean
                  default: true
                  description: Fișierul are header row
                skipRows:
                  type: integer
                  default: 0
                  description: Număr de rânduri de sărit
                encoding:
                  type: string
                  default: utf-8
                  description: Encoding fișier (utf-8, latin1, etc.)
                delimiter:
                  type: string
                  default: ","
                  description: Delimiter pentru CSV
                sheetName:
                  type: string
                  description: Numele sheet-ului pentru Excel
      responses:
        "201":
          description: Import creat și în procesare
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportCreatedResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "413":
          description: Fișier prea mare (max 100MB)

  /imports/{importId}:
    get:
      tags: [Imports]
      operationId: getImport
      summary: Obține detalii import
      description: |
        Returnează detalii complete despre un batch de import,
        inclusiv progres, erori, și statistici per coloană.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ImportIdParam"
      responses:
        "200":
          description: Detalii import
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportDetailResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /imports/{importId}/cancel:
    post:
      tags: [Imports]
      operationId: cancelImport
      summary: Anulează un import în curs
      description: Oprește procesarea unui import. Rândurile deja procesate rămân.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ImportIdParam"
      responses:
        "200":
          description: Import anulat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportCancelledResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Doar importurile active (pending/processing) pot fi anulate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ==================== BRONZE ====================
  /bronze/contacts:
    get:
      tags: [Bronze]
      operationId: listBronzeContacts
      summary: Listează contacte din Bronze layer
      description: |
        Listează contactele brute din Bronze layer cu paginare și filtrare.
        Bronze layer conține datele originale nemodificate.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/LimitParam"
        - $ref: "#/components/parameters/OffsetParam"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/BronzeProcessingStatus"
        - name: sourceType
          in: query
          schema:
            $ref: "#/components/schemas/ImportSourceType"
        - name: search
          in: query
          schema:
            type: string
          description: Căutare în extractedName, extractedCui, extractedEmail
        - name: batchId
          in: query
          schema:
            type: string
            format: uuid
          description: Filtrare după batch import
        - name: dateFrom
          in: query
          schema:
            type: string
            format: date-time
          description: Data de început pentru filtrare
        - name: dateTo
          in: query
          schema:
            type: string
            format: date-time
          description: Data de sfârșit pentru filtrare
        - name: sortBy
          in: query
          schema:
            type: string
            enum: [createdAt, extractedName, sourceType]
            default: createdAt
        - name: sortDir
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
        "200":
          description: Lista contacte Bronze
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BronzeContactListResponse"

  /bronze/contacts/{contactId}:
    get:
      tags: [Bronze]
      operationId: getBronzeContact
      summary: Obține detalii contact Bronze
      description: Returnează datele complete pentru un contact din Bronze layer
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ContactIdParam"
      responses:
        "200":
          description: Detalii contact Bronze
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BronzeContactDetailResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /bronze/contacts/{contactId}/reprocess:
    post:
      tags: [Bronze]
      operationId: reprocessBronzeContact
      summary: Re-procesează un contact Bronze
      description: |
        Repornește procesarea unui contact din Bronze layer.
        Util pentru contacte cu erori sau care trebuie re-validate.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ContactIdParam"
      responses:
        "200":
          description: Contact programat pentru re-procesare
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReprocessResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  # ==================== SILVER ====================
  /silver/companies:
    get:
      tags: [Silver]
      operationId: listSilverCompanies
      summary: Listează companii din Silver layer
      description: |
        Listează companiile îmbogățite din Silver layer.
        Silver layer conține date validate și îmbogățite din surse externe.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/LimitParam"
        - $ref: "#/components/parameters/OffsetParam"
        - name: search
          in: query
          schema:
            type: string
          description: Căutare în denumire, CUI
        - name: cuiValidated
          in: query
          schema:
            type: boolean
        - name: enrichmentStatus
          in: query
          schema:
            $ref: "#/components/schemas/EnrichmentStatus"
        - name: promotionStatus
          in: query
          schema:
            $ref: "#/components/schemas/PromotionStatus"
        - name: statusFirma
          in: query
          schema:
            $ref: "#/components/schemas/StatusFirma"
        - name: judet
          in: query
          schema:
            type: string
        - name: minQualityScore
          in: query
          schema:
            type: integer
            minimum: 0
            maximum: 100
        - name: maxQualityScore
          in: query
          schema:
            type: integer
            minimum: 0
            maximum: 100
        - name: sortBy
          in: query
          schema:
            type: string
            enum: [updatedAt, totalQualityScore, createdAt]
            default: updatedAt
        - name: sortDir
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
        "200":
          description: Lista companii Silver
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SilverCompanyListResponse"

  /silver/companies/{companyId}:
    get:
      tags: [Silver]
      operationId: getSilverCompany
      summary: Obține detalii companie Silver
      description: |
        Returnează toate datele îmbogățite pentru o companie din Silver layer,
        inclusiv date ANAF, Termene.ro, geocoding, și scoring.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CompanyIdParam"
      responses:
        "200":
          description: Detalii companie Silver
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SilverCompanyDetailResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /silver/companies/{companyId}/enrich:
    post:
      tags: [Silver]
      operationId: enrichSilverCompany
      summary: Trigger îmbogățire manuală
      description: |
        Pornește sau re-pornește procesul de îmbogățire pentru o companie.
        Poate specifica sursele de îmbogățire dorite.
        
        **NOTĂ:** Acest endpoint este ASINCRON. Returnează imediat confirmarea că job-ul a fost adăugat în coadă.
        Procesarea reală se face în background prin workers BullMQ.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CompanyIdParam"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                sources:
                  type: array
                  items:
                    type: string
                    enum: [anaf, termene, onrc, geocoding, email, phone]
                  description: Surse de îmbogățire (default toate)
                force:
                  type: boolean
                  default: false
                  description: Re-îmbogățește chiar dacă deja completat
      responses:
        "200":
          description: Job de îmbogățire adăugat în coadă
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueuedResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
      responses:
        "200":
          description: Îmbogățire pornită
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnrichmentStartedResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /silver/companies/{companyId}/promote:
    post:
      tags: [Silver]
      operationId: promoteSilverCompany
      summary: Promovează companie în Gold
      description: |
        Promovează manual o companie din Silver în Gold layer.
        Necesită quality score >= 70 sau force=true.
        
        **NOTĂ:** Acest endpoint este ASINCRON. Returnează imediat confirmarea că job-ul a fost adăugat în coadă.
        Procesarea reală se face în background prin workers BullMQ.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CompanyIdParam"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                force:
                  type: boolean
                  default: false
                  description: Promovează chiar dacă quality < 70
      responses:
        "200":
          description: Job de promovare adăugat în coadă
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueuedResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
                $ref: "#/components/schemas/PromotionResponse"
        "400":
          description: Nu poate fi promovată (quality prea mic)
        "404":
          $ref: "#/components/responses/NotFound"

  /silver/enrichment-log:
    get:
      tags: [Silver]
      operationId: getEnrichmentLog
      summary: Obține log îmbogățire
      description: Returnează istoricul operațiilor de îmbogățire pentru o entitate
      security:
        - BearerAuth: []
      parameters:
        - name: entityId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/LimitParam"
        - $ref: "#/components/parameters/OffsetParam"
      responses:
        "200":
          description: Log îmbogățire
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnrichmentLogResponse"

  # ==================== GOLD ====================
  /gold/companies:
    get:
      tags: [Gold]
      operationId: listGoldCompanies
      summary: Listează companii din Gold layer
      description: |
        Listează lead-urile calificate din Gold layer.
        Gold layer conține companiile gata pentru outreach și vânzări.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/LimitParam"
        - $ref: "#/components/parameters/OffsetParam"
        - name: search
          in: query
          schema:
            type: string
        - name: currentState
          in: query
          schema:
            type: array
            items:
              $ref: "#/components/schemas/LeadState"
        - name: minLeadScore
          in: query
          schema:
            type: integer
            minimum: 0
            maximum: 100
        - name: maxLeadScore
          in: query
          schema:
            type: integer
            minimum: 0
            maximum: 100
        - name: categorieDimensiune
          in: query
          schema:
            type: string
            enum: [MICRO, MICA, MEDIE, MARE]
        - name: isAgricultural
          in: query
          schema:
            type: boolean
        - name: judetCod
          in: query
          schema:
            type: string
            maxLength: 2
        - name: categorieRisc
          in: query
          schema:
            $ref: "#/components/schemas/CategorieRisc"
        - name: assignedTo
          in: query
          schema:
            type: string
            format: uuid
        - name: unassigned
          in: query
          schema:
            type: boolean
        - name: doNotContact
          in: query
          schema:
            type: boolean
        - name: sortBy
          in: query
          schema:
            type: string
            enum: [updatedAt, leadScore, createdAt]
            default: updatedAt
        - name: sortDir
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
        "200":
          description: Lista companii Gold
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoldCompanyListResponse"

  /gold/companies/{companyId}:
    get:
      tags: [Gold]
      operationId: getGoldCompany
      summary: Obține detalii companie Gold
      description: |
        Returnează toate datele pentru un lead din Gold layer,
        inclusiv lead scoring, FSM state, și istoricul interacțiunilor.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CompanyIdParam"
      responses:
        "200":
          description: Detalii companie Gold
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoldCompanyDetailResponse"
        "404":
          $ref: "#/components/responses/NotFound"

    patch:
      tags: [Gold]
      operationId: updateGoldCompany
      summary: Actualizează companie Gold
      description: Actualizează parțial o companie din Gold layer
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CompanyIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoldCompanyUpdateRequest"
      responses:
        "200":
          description: Companie actualizată
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoldCompanyUpdateResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /gold/companies/{companyId}/transition:
    post:
      tags: [Gold]
      operationId: transitionGoldCompany
      summary: Tranziție FSM state
      description: |
        Execută o tranziție de state în FSM-ul lead-ului.
        Validează tranzițiile permise și loghează în state history.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CompanyIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - toState
              properties:
                toState:
                  $ref: "#/components/schemas/LeadState"
                metadata:
                  type: object
                  additionalProperties: true
                  description: Metadata asociat tranziției
      responses:
        "200":
          description: Tranziție executată
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransitionResponse"
        "400":
          description: Tranziție invalidă
        "404":
          $ref: "#/components/responses/NotFound"

  # ==================== APPROVALS ====================
  /enrichment/approvals:
    get:
      tags: [Approvals]
      operationId: listApprovals
      summary: Listează task-uri de aprobare
      description: |
        Listează toate task-urile de aprobare HITL cu paginare și filtrare.
        HITL (Human-in-the-Loop) este folosit pentru validarea datelor incerte.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/LimitParam"
        - $ref: "#/components/parameters/OffsetParam"
        - name: status
          in: query
          schema:
            type: array
            items:
              $ref: "#/components/schemas/ApprovalStatus"
        - name: approvalType
          in: query
          schema:
            $ref: "#/components/schemas/ApprovalType"
        - name: priorityLevel
          in: query
          schema:
            $ref: "#/components/schemas/ApprovalPriority"
        - name: assignedTo
          in: query
          schema:
            type: string
            format: uuid
        - name: pipelineStage
          in: query
          schema:
            type: string
            enum: [E1, E2, E3, E4, E5]
        - name: sortBy
          in: query
          schema:
            type: string
            enum: [dueAt, createdAt, priorityLevel]
            default: dueAt
        - name: sortDir
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: asc
      responses:
        "200":
          description: Lista aprobări
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalListResponse"

  /enrichment/approvals/{approvalId}:
    get:
      tags: [Approvals]
      operationId: getApproval
      summary: Obține detalii aprobare
      description: Returnează detalii complete pentru un task de aprobare
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ApprovalIdParam"
      responses:
        "200":
          description: Detalii aprobare
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalDetailResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /enrichment/approvals/{approvalId}/assign:
    post:
      tags: [Approvals]
      operationId: assignApproval
      summary: Asignează task de aprobare
      description: Asignează sau de-asignează un task de aprobare unui utilizator
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ApprovalIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                assignTo:
                  type: string
                  format: uuid
                  nullable: true
                  description: User ID pentru asignare, null pentru de-asignare
      responses:
        "200":
          description: Task asignat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalAssignResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /enrichment/approvals/{approvalId}/decide:
    post:
      tags: [Approvals]
      operationId: decideApproval
      summary: Decide pe task de aprobare
      description: |
        Înregistrează decizia (approved/rejected) pentru un task de aprobare.
        Deciziile sunt finale și declanșează acțiunile corespunzătoare în pipeline.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ApprovalIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - decision
              properties:
                decision:
                  type: string
                  enum: [approve, reject, merge, skip]
                reason:
                  type: string
                  maxLength: 1000
                  description: Motivul deciziei
      responses:
        "200":
          description: Decizie înregistrată
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalDecisionResponse"
        "400":
          description: Task deja decis sau expirat
        "404":
          $ref: "#/components/responses/NotFound"

  /enrichment/approvals/{approvalId}/escalate:
    post:
      tags: [Approvals]
      operationId: escalateApproval
      summary: Escaladează task de aprobare
      description: Escaladează un task HITL la un supervisor sau la o prioritate mai mare
      security:
        - BearerAuth: []
      parameters:
        - name: approvalId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  maxLength: 2000
                  description: Motivul escaladării
                escalateTo:
                  type: string
                  format: uuid
                  description: ID user căruia i se escaladează
      responses:
        "200":
          description: Task escaldat
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      status:
                        type: string
                        enum: [escalated]
        "404":
          $ref: "#/components/responses/NotFound"

  # ==================== SILVER DEDUP ====================
  /silver/dedup-candidates:
    get:
      tags: [Silver]
      operationId: listDedupCandidates
      summary: Listează candidați deduplicare
      description: Returnează perechi de companii potențial duplicate pentru revizuire
      security:
        - BearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, auto_merged, hitl_pending, merged, rejected, expired]
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: Lista candidați dedup
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/DedupCandidate"
                  meta:
                    $ref: "#/components/schemas/PaginationMeta"

  /silver/dedup-candidates/{candidateId}/decide:
    post:
      tags: [Silver]
      operationId: decideDedupCandidate
      summary: Decide asupra candidat deduplicare
      description: |
        Decide dacă două companii duplicate se vor fuziona sau nu.
        Dacă decizia este "merge", compania secundară va fi marcată ca non-master
        și toate referințele vor fi actualizate la compania master.
      security:
        - BearerAuth: []
      parameters:
        - name: candidateId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision:
                  type: string
                  enum: [merge, reject, skip]
                masterCompanyId:
                  type: string
                  format: uuid
                  description: ID compania master (default companyAId dacă nu se specifică)
                reason:
                  type: string
                  maxLength: 2000
      responses:
        "200":
          description: Decizie înregistrată
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      decision:
                        type: string
                        enum: [merge, reject, skip]
                      masterCompanyId:
                        type: string
                        format: uuid
                        nullable: true
        "404":
          $ref: "#/components/responses/NotFound"

  /gold/companies/{companyId}/journey:
    get:
      tags: [Gold]
      operationId: getGoldLeadJourney
      summary: Returnează istoricul stărilor unui lead Gold
      description: Returnează toate tranzițiile de stare FSM ale unui lead Gold
      security:
        - BearerAuth: []
      parameters:
        - name: companyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Istoricul tranzițiilor
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        fromState:
                          type: string
                        toState:
                          type: string
                        triggeredBy:
                          type: string
                          format: uuid
                          nullable: true
                        transitionedAt:
                          type: string
                          format: date-time
                        note:
                          type: string
                          nullable: true
        "404":
          $ref: "#/components/responses/NotFound"

  # ==================== ENRICHMENT QUEUES ====================
  /enrichment/queues:
    get:
