  /enrichment/queues/{queueName}/resume:
    post:
      tags: [Enrichment]
      operationId: resumeEnrichmentQueue
      summary: Repornește queue
      description: Repornește procesarea unui queue de îmbogățire
      security:
        - BearerAuth: []
      parameters:
        - name: queueName
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Queue repornit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueueStatusResponse"
        "404":
          description: Queue inexistent

  # ==================== IMPORTS EXTENDED ====================
  /imports/template:
    get:
      tags: [Imports]
      operationId: downloadImportTemplate
      summary: Descarca template CSV/Excel pentru import
      security:
        - BearerAuth: []
