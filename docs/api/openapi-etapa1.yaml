            default: 25
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: Randuri import
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessListResponse"

  /imports/{importId}/entities:
    get:
      tags: [Imports]
      operationId: getImportEntities
      summary: Entitatile create din import (Bronze contacts)
      security:
