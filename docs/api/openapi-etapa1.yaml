            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary

  /imports/template/columns:
    get:
      tags: [Imports]
      operationId: getTemplateColumns
      summary: Listeaza coloanele disponibile in template
