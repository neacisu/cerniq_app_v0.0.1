      responses:
        "200":
          description: Promovare reluată
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessObjectResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /imports/{importId}/anaf-enrich:
    post:
      tags: [Imports]
      operationId: anafEnrichImport
      summary: Pornește îmbogățirea ANAF pentru toate companiile silver din import
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ImportIdParam"
      responses:
        "200":
          description: Îmbogățire ANAF pornită
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessObjectResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /imports/{importId}/reprocess-errors/resume:
    post:
      tags: [Imports]
      operationId: resumeReprocessErrors
      summary: Reia reprocesarea erorilor de import
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ImportIdParam"
      responses:
        "200":
          description: Reprocesare reluată
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessObjectResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  # ==================== DASHBOARD EXTENDED ====================
  /dashboard/daily-stats:
    get:
      tags: [Dashboard]
      operationId: getDailyStats
      summary: Statistici zilnice agregate pe o perioadă configurabilă
      security:
        - BearerAuth: []
      parameters:
        - name: days
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 365
            default: 30
          description: Numărul de zile de statistici
        - name: pipelineStage
          in: query
          schema:
            type: string
          description: Filtrare după pipeline stage
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 365
          description: Număr maxim de rezultate
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
          description: Offset pentru paginare
      responses:
        "200":
          description: Statistici zilnice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessListResponse"
        "400":
          $ref: "#/components/responses/ValidationError"

  # ==================== ENRICHMENT QUEUES EXTENDED ====================
  /enrichment/queues/{queueName}:
    get:
      tags: [Enrichment]
      operationId: getQueueStatus
      summary: Status detaliat pentru o coadă de îmbogățire specifică
      security:
        - BearerAuth: []
      parameters:
        - name: queueName
          in: path
          required: true
          schema:
            type: string
          description: Numele cozii (e.g. enrich:anaf:cui, pipeline:orchestrate)
      responses:
        "200":
          description: Status coadă
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueueStatusResponse"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token obținut din /api/v1/auth/login

  parameters:
    LimitParam:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
      description: Număr maxim de rezultate returnate

    OffsetParam:
      name: offset
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
      description: Număr de rezultate de sărit (pentru paginare)

    ImportIdParam:
      name: importId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: ID-ul batch-ului de import

    ContactIdParam:
      name: contactId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: ID-ul contactului

    CompanyIdParam:
      name: companyId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: ID-ul companiei

    ApprovalIdParam:
      name: approvalId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: ID-ul task-ului de aprobare

    TenantIdHeader:
      name: X-Tenant-ID
      in: header
      required: true
      schema:
        type: string
        format: uuid
      description: ID-ul tenant-ului pentru multi-tenancy. Toate endpoint-urile necesită acest header.

  responses:
    Unauthorized:
      description: Autentificare necesară sau token invalid
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    NotFound:
      description: Resursa nu a fost găsită
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    ValidationError:
      description: Eroare de validare
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    # ========== COMMON ==========
    ErrorResponse:
      type: object
      required:
        - success
        - error
      properties:
        success:
          type: boolean
          const: false
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
              additionalProperties: true

    PaginationMeta:
      type: object
      required:
        - total
        - limit
        - offset
      properties:
        total:
          type: integer
          description: Numărul total de rezultate disponibile
        limit:
          type: integer
          description: Numărul de rezultate returnate în acest răspuns
        offset:
          type: integer
          description: Numărul de rezultate sărite

    # ========== ENUMS ==========
    ImportStatus:
      type: string
      enum: [pending, processing, completed, failed, cancelled]

    ImportSourceType:
      type: string
      enum: [csv_import, webhook, scrape, manual, api, excel_import]

    BronzeProcessingStatus:
      type: string
      enum: [pending, processing, promoted, rejected, error]

    EnrichmentStatus:
      type: string
      enum: [pending, in_progress, partial, complete, failed]

    PromotionStatus:
      type: string
      enum: [eligible, review_required, blocked, promoted]

    StatusFirma:
      type: string
      enum: [ACTIVA, INACTIVA, DIZOLVARE, RADIATA, INSOLVENTA, UNKNOWN]

    LeadState:
      type: string
      enum:
        - COLD
        - CONTACTED_WA
        - CONTACTED_EMAIL
        - CONTACTED_PHONE
        - WARM_REPLY
        - ENGAGED
        - NEGOTIATION
        - PROPOSAL
        - CLOSING
        - CONVERTED
        - ONBOARDING
        - NURTURING_ACTIVE
        - AT_RISK
        - LOYAL_ADVOCATE
        - CHURNED
        - DEAD
        - DO_NOT_CONTACT

    CategorieRisc:
      type: string
      enum: [LOW, MEDIUM, HIGH]

    ApprovalStatus:
      type: string
      enum: [pending, assigned, approved, rejected, expired, escalated]

    ApprovalType:
      type: string
      enum:
        - dedup_review
        - identity_conflict
        - quality_review
        - ai_structuring_review
        - ai_merge_review
        - low_confidence_review
        - data_anomaly
        - manual_verification
        - error_review

    ApprovalPriority:
      type: string
      enum: [critical, high, normal, low]

    # ========== DASHBOARD ==========
    DashboardStatsResponse:
      type: object
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          const: true
        data:
          type: object
          required:
            - bronze
            - silver
            - gold
            - approvals
            - errors
            - pipeline
          properties:
            bronze:
              type: object
              properties:
                total:
                  type: integer
                pending:
                  type: integer
                processing:
                  type: integer
                promoted:
                  type: integer
            silver:
              type: object
              properties:
                total:
                  type: integer
                pending:
                  type: integer
                inProgress:
                  type: integer
                complete:
                  type: integer
                eligible:
                  type: integer
            gold:
              type: object
              properties:
                total:
                  type: integer
                cold:
                  type: integer
                engaged:
                  type: integer
                converted:
                  type: integer
            approvals:
              type: object
              properties:
                pending:
                  type: integer
                overdue:
                  type: integer
            errors:
              type: object
              properties:
                last24h:
                  type: integer
                critical:
                  type: integer
            pipeline:
              type: object
              properties:
                queueDepth:
                  type: integer
                failingQueues:
                  type: integer

    ActivityListResponse:
      type: object
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          const: true
        data:
          type: array
          items:
            type: object
            required:
              - id
              - type
              - timestamp
              - message
            properties:
              id:
                type: string
                description: ID unic al activității (prefix: err-, approval-, silver-)
              type:
                type: string
                enum: [pipeline_error, approval, silver_update]
              timestamp:
                type: string
                format: date-time
              message:
                type: string
              severity:
                type: string
                description: Severitate (pentru pipeline_error) sau urgency (pentru approval) sau promotionStatus (pentru silver_update)

    # ========== IMPORTS ==========
    ImportListResponse:
      type: object
      required:
        - success
        - data
        - meta
      properties:
        success:
          type: boolean
          const: true
        data:
          type: array
          items:
            $ref: "#/components/schemas/ImportSummary"
        meta:
          $ref: "#/components/schemas/PaginationMeta"

    ImportSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        filename:
          type: string
        sourceType:
          $ref: "#/components/schemas/ImportSourceType"
        fileSizeBytes:
          type: integer
        totalRows:
          type: integer
        processedRows:
          type: integer
        successRows:
          type: integer
        errorRows:
          type: integer
        duplicateRows:
          type: integer
        status:
          $ref: "#/components/schemas/ImportStatus"
        importedBy:
          type: object
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
        startedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time

    ImportCreatedResponse:
      type: object
      required:
        - success
