                  type: object
                  additionalProperties:
                    type: string
                  description: Mapping de coloane opțional (suprascrie mapping-ul existent)
      responses:
        "200":
          description: Import reprogramat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessObjectResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Importul este deja în procesare sau completat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /imports/{importId}/headers:
    get:
      tags: [Imports]
