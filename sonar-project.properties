sonar.projectKey=neacisu_cerniq_app_v0.0.1
sonar.organization=neacisu
sonar.host.url=https://sonarcloud.io

# Sources
sonar.sources=apps,workers,packages,services
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/*.spec.ts,**/*.test.ts,**/playwright-report/**,**/test-results/**
sonar.tests=apps,workers,packages,e2e,tests
sonar.test.inclusions=**/*.spec.ts,**/*.test.ts,**/e2e/**,**/tests/**

# TypeScript
sonar.typescript.lcov.reportPaths=apps/web/coverage/lcov.info,apps/api/coverage/lcov.info

# Migrații Drizzle SQL: politici RLS repetă același fragment `current_setting('app.tenant_id', true)::uuid`
# — duplicarea este intenționată (fiecare policy este autonomă); Sonar plsql:S1192 nu se aplică util aici.
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=plsql:S1192
sonar.issue.ignore.multicriteria.e1.resourceKey=**/packages/db/drizzle/*.sql
