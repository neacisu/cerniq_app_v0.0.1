# =============================================================================
# Cerniq.app - Production Docker Compose Override
# =============================================================================
# Version: 2.0.0 (Full path corrections for server deployment)
# Purpose: Override relative paths for /opt/cerniq server structure
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Server directory structure:
#   /opt/cerniq/
#   ├── docker-compose.yml
#   ├── docker-compose.prod.yml
#   ├── config/
#   │   ├── postgres/
#   │   └── openbao/
#   ├── scripts/
#   └── secrets/
# =============================================================================

name: cerniq

# Application ingress ports are routed by orchestrator Traefik.
# În `docker-compose.yml` mapările sunt host:container aceeași (ex. 64000:64000); vezi ADR-0022 + etapa0-port-matrix.

services:
  # ==========================================================================
  # PgBouncer - Path overrides for production
  # ==========================================================================
  pgbouncer:
    environment: {}
    networks:
      cerniq_data:
        ipv4_address: 172.29.30.11
      cerniq_backend:
        ipv4_address: 172.29.20.11
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
        reservations:
          cpus: "0.5"
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  # ==========================================================================
  # OpenBao Agent API - Path overrides + reachable OpenBao address
  # ==========================================================================
  # VAULT_ADDR from OPENBAO_ADDR (.env) so agents connect to same endpoint as CI;
  # extra_hosts: [] overrides base (no 10.0.1.10) so staging can reach OpenBao.
  openbao-agent-api:
    environment:
      VAULT_ADDR: ${OPENBAO_ADDR}
    extra_hosts: []
    volumes:
      # Server paths are relative to /opt/cerniq (where compose files are deployed).
      - ./config/openbao/agent-api.hcl:/openbao/config/agent-api.hcl:ro
      - ./config/openbao/templates:/openbao/templates:ro
      - ${CERNIQ_RENDERED_SECRETS_DIR:-/opt/cerniq/runtime-secrets}/api:/secrets
      - ./secrets/api_role_id:/openbao/config/role_id:ro
      - ./secrets/api_secret_id:/openbao/config/secret_id:ro
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  # ==========================================================================
  # OpenBao Agent Workers - Path overrides + reachable OpenBao address
  # ==========================================================================
  openbao-agent-workers:
    environment:
      VAULT_ADDR: ${OPENBAO_ADDR}
    extra_hosts: []
    volumes:
      - ./config/openbao/agent-workers.hcl:/openbao/config/agent-workers.hcl:ro
      - ./config/openbao/templates:/openbao/templates:ro
      - ${CERNIQ_RENDERED_SECRETS_DIR:-/opt/cerniq/runtime-secrets}/workers:/secrets
      - ./secrets/workers_role_id:/openbao/config/role_id:ro
      - ./secrets/workers_secret_id:/openbao/config/secret_id:ro
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  # ==========================================================================
  # OpenBao Agent Infra - Path overrides + reachable OpenBao address
  # ==========================================================================
  openbao-agent-infra:
    environment:
      VAULT_ADDR: ${OPENBAO_ADDR}
    extra_hosts: []
    volumes:
      - ./config/openbao/agent-infra.hcl:/openbao/config/agent-infra.hcl:ro
      - ./config/openbao/templates:/openbao/templates:ro
      - ${CERNIQ_RENDERED_SECRETS_DIR:-/opt/cerniq/runtime-secrets}/infra:/secrets
      - ./secrets/infra_role_id:/openbao/config/role_id:ro
      - ./secrets/infra_secret_id:/openbao/config/secret_id:ro
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  # ==========================================================================
  # PgBouncer Exporter - Production overrides
  # ==========================================================================
  pgbouncer-exporter:
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ==========================================================================
  # Application Stack - Production overrides
  # ==========================================================================
  cerniq-web:
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  cerniq-api:
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  cerniq-admin:
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  cerniq-monitoring-api:
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  cadvisor:
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  cerniq-worker-enrichment:
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

# =============================================================================
# Networks - External (pre-created on server)
# =============================================================================
networks:
  cerniq_public:
    external: true
  cerniq_backend:
    external: true
  cerniq_data:
    external: true
