# ============================================================================
# Cerniq.app - Docker Compose Base Configuration
# ============================================================================
# Version: 1.0.2
# Last Updated: 2026-02-04
# References: ADR-0015, ADR-0022, ADR-0027
# ============================================================================
# IMPORTANT: Networks are created externally via `docker network create`
# to ensure proper isolation and persistence across compose restarts.
# See: docs/infrastructure/network-topology.md
# ============================================================================

name: cerniq

# ============================================================================
# Networks (External)
# ============================================================================
# Networks are pre-created on servers (staging/production) with:
#   docker network create --subnet X.X.X.X/24 [--internal] <name>
#
# Subnets (standardized under 172.29.0.0/16):
# - cerniq_public:  172.29.10.0/24 (external access via orchestrator Traefik)
# - cerniq_backend: 172.29.20.0/24 (internal: API + Workers)
# - cerniq_data:    172.29.30.0/24 (internal: PostgreSQL + Redis)
# ============================================================================

networks:
  cerniq_public:
    external: true
  cerniq_backend:
    external: true
  cerniq_data:
    external: true

# ============================================================================
# Volumes (add named volumes here when needed)
# ============================================================================
volumes:
  cerniq_imports:

# ============================================================================
# X-Common Configurations (YAML Anchors)
# ============================================================================
# Reusable configuration blocks for services
# ============================================================================

x-common-labels: &common-labels
  com.cerniq.app: "cerniq"
  com.cerniq.environment: "${CERNIQ_ENV:-development}"
  com.cerniq.version: "${CERNIQ_VERSION:-0.0.0}"

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

# ============================================================================
# Secrets
# ============================================================================
# Secrets are sourced from OpenBao and materialized to files on the host.
# Default path is /opt/cerniq/secrets in deployments.
# ============================================================================

# ============================================================================
# Services
# ============================================================================
# E0-S2-PR02: PostgreSQL 18.1 + PgBouncer
# ============================================================================

services:
  # ==========================================================================
  # Application Stack — Web, API, Admin, Monitoring API
  # ==========================================================================
  # Routing: Orchestrator Traefik -> HAProxy (10.0.1.10) -> CT109/CT110
  #   Staging:    19000->64000 (web), 19010->64010 (api), 19012->64012 (admin)
  #   Production: 29000->64000 (web), 29010->64010 (api), 29012->64012 (admin)
  # ==========================================================================

  cerniq-web:
    image: ${REGISTRY:-ghcr.io}/${IMAGE_OWNER:-cerniqapp}/cerniq/web:${CERNIQ_VERSION:-latest}
    container_name: cerniq-web
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "64000:64000"
    networks:
      - cerniq_public
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:64000/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"
        reservations:
          memory: 64M
          cpus: "0.1"
    labels:
      <<: *common-labels
      com.cerniq.service: "web"
      com.cerniq.port: "64000"
    logging:
      <<: *default-logging

  cerniq-api:
    image: ${REGISTRY:-ghcr.io}/${IMAGE_OWNER:-cerniqapp}/cerniq/api:${CERNIQ_VERSION:-latest}
    container_name: cerniq-api
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "64010:64010"
    volumes:
      - ${CERNIQ_RENDERED_SECRETS_DIR:-/opt/cerniq/runtime-secrets}/api:/secrets:ro
      - cerniq_imports:/app/data/imports
    environment:
      NODE_ENV: ${CERNIQ_ENV:-staging}
      PORT: "64010"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SECRETS_PATH: /secrets/api.env
    extra_hosts:
      - "ct107-postgres:10.0.1.107"
    networks:
      - cerniq_public
      - cerniq_backend
    depends_on:
      pgbouncer:
        condition: service_healthy
      openbao-agent-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:64010/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
        reservations:
          memory: 256M
          cpus: "0.25"
    labels:
      <<: *common-labels
      com.cerniq.service: "api"
      com.cerniq.port: "64010"
    logging:
      <<: *default-logging

  cerniq-admin:
    image: ${REGISTRY:-ghcr.io}/${IMAGE_OWNER:-cerniqapp}/cerniq/web-admin:${CERNIQ_VERSION:-latest}
    container_name: cerniq-admin
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "64012:64012"
    networks:
      - cerniq_public
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:64012/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"
        reservations:
          memory: 64M
          cpus: "0.1"
    labels:
      <<: *common-labels
      com.cerniq.service: "admin"
      com.cerniq.port: "64012"
    logging:
      <<: *default-logging

  cerniq-monitoring-api:
    image: ${REGISTRY:-ghcr.io}/${IMAGE_OWNER:-cerniqapp}/cerniq/monitoring-api:${CERNIQ_VERSION:-latest}
    container_name: cerniq-monitoring-api
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "64080:64080"
    volumes:
      - ${CERNIQ_RENDERED_SECRETS_DIR:-/opt/cerniq/runtime-secrets}/api:/secrets:ro
    environment:
      NODE_ENV: ${CERNIQ_ENV:-staging}
      PORT: "64080"
      SECRETS_PATH: /secrets/api.env
    networks:
      - cerniq_backend
    depends_on:
      openbao-agent-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:64080/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "2.0"
        reservations:
          memory: 128M
          cpus: "0.1"
    labels:
      <<: *common-labels
      com.cerniq.service: "monitoring-api"
      com.cerniq.port: "64080"
    logging:
      <<: *default-logging

  # ==========================================================================
  # Workers — BullMQ (Etapa 0/1 active runtime)
  # ==========================================================================
  # Redis connection via OpenBao-rendered workers.env (REDIS_URL, REDIS_PREFIX).
  # ==========================================================================
  cerniq-worker-enrichment:
    image: ${REGISTRY:-ghcr.io}/${IMAGE_OWNER:-cerniqapp}/cerniq/worker-enrichment:${CERNIQ_VERSION:-latest}
    container_name: cerniq-worker-enrichment
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    env_file:
      - ${CERNIQ_RENDERED_SECRETS_DIR:-/opt/cerniq/runtime-secrets}/workers/workers.env
    environment:
      NODE_ENV: ${CERNIQ_ENV:-staging}
      PORT: "3000"
      IMPORT_UPLOAD_DIR: /app/data/imports
    volumes:
      - cerniq_imports:/app/data/imports
    networks:
      - cerniq_backend
    depends_on:
      openbao-agent-workers:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    labels:
      <<: *common-labels
      com.cerniq.service: "worker-enrichment"
    logging:
      <<: *default-logging
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "2.0"
        reservations:
          memory: 256M
          cpus: "0.25"

  # ==========================================================================
  # PgBouncer 1.25 - Connection Pooling
  # ==========================================================================
  # Reference: pgbouncer-connection-pooling.md, ADR-0004
  # Security: Password read from secret file at runtime (F0.8.1)
  # ==========================================================================
  pgbouncer:
    # NOTE: specific tags are not consistently resolvable from all environments;
    # use latest and pin to digest if reproducibility is required.
    image: edoburu/pgbouncer:v1.25.1-p0
    container_name: cerniq-pgbouncer
    restart: unless-stopped
    # Security hardening - F0.8.1.T003
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # NOTE: read_only disabled - pgbouncer image needs to write config files
    # and access Docker secrets. Security maintained via network isolation,
    # no-new-privileges, and cap_drop ALL.
    # Run as deploy user to read tmpfs-rendered secrets (LXC-safe).
    user: "1000:1000"
    volumes:
      # Config + auth are rendered by OpenBao Agent into tmpfs (preferred) or host path.
      - ${CERNIQ_RENDERED_SECRETS_DIR:-/opt/cerniq/runtime-secrets}/infra:/etc/pgbouncer:ro
    environment:
      # Expose env to template (used indirectly via agent to select DB names).
      CERNIQ_ENV: ${CERNIQ_ENV:-staging}
    entrypoint: ["/usr/bin/pgbouncer", "/etc/pgbouncer/pgbouncer.ini"]
    extra_hosts:
      - "ct107-postgres:10.0.1.107"
    networks:
      cerniq_data:
        ipv4_address: 172.29.30.11
      cerniq_backend:
        ipv4_address: 172.29.20.11
    # NO ports exposed - internal network only (security)
    healthcheck:
      # pg_isready exit codes: 0=accepting, 3=no attempt (still OK for PgBouncer)
      test:
        [
          "CMD",
          "sh",
          "-c",
          'pg_isready -h localhost -p 64033 >/dev/null 2>&1; rc=$$?; [ "$$rc" = "0" ] || [ "$$rc" = "3" ]',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
        reservations:
          memory: 256M
          cpus: "0.25"
    labels:
      <<: *common-labels
      com.cerniq.service: "pgbouncer"
      com.cerniq.port: "64033"
    logging:
      <<: *default-logging

  # ==========================================================================
  # OpenBao Agent - API Service Sidecar
  # ==========================================================================
  # Injects secrets into API service via template rendering
  # Auto-renews tokens and database credentials
  # ==========================================================================
  openbao-agent-api:
    image: quay.io/openbao/openbao:2.5.0
    container_name: cerniq-openbao-agent-api
    restart: unless-stopped
    # Run as deploy user (LXC-safe file permissions).
    user: "1000:1000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETGID
      - SETUID
    command: agent -config=/openbao/config/agent-api.hcl
    environment:
      CERNIQ_ENV: ${CERNIQ_ENV:-staging}
    extra_hosts:
      # Force OpenBao traffic to stay internal via hz.247 L4 gateway (10.0.1.10:443 -> orchestrator Traefik).
      - "s3cr3ts.neanelu.ro:10.0.1.10"
    volumes:
      # Agent configuration
      - ../config/openbao/agent-api.hcl:/openbao/config/agent-api.hcl:ro
      - ../config/openbao/templates:/openbao/templates:ro
      # Secrets output volume (shared with API service)
      - ${CERNIQ_RENDERED_SECRETS_DIR:-/opt/cerniq/runtime-secrets}/api:/secrets
      # AppRole credentials (populated by setup script)
      - ../../secrets/api_role_id:/openbao/config/role_id:ro
      - ../../secrets/api_secret_id:/openbao/config/secret_id:ro
    networks:
      - cerniq_backend
    healthcheck:
      # Check if secrets file exists (template rendered)
      test: ["CMD", "test", "-f", "/secrets/api.env"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"
        reservations:
          memory: 64M
          cpus: "0.1"
    labels:
      <<: *common-labels
      com.cerniq.service: "openbao-agent-api"
    logging:
      <<: *default-logging

  # ==========================================================================
  # OpenBao Agent - Workers Service Sidecar
  # ==========================================================================
  # Injects secrets into Workers services via template rendering
  # Auto-renews tokens and database credentials
  # ==========================================================================
  openbao-agent-workers:
    image: quay.io/openbao/openbao:2.5.0
    container_name: cerniq-openbao-agent-workers
    restart: unless-stopped
    # Run as deploy user (LXC-safe file permissions).
    user: "1000:1000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETGID
      - SETUID
    command: agent -config=/openbao/config/agent-workers.hcl
    environment:
      CERNIQ_ENV: ${CERNIQ_ENV:-staging}
    extra_hosts:
      # Force OpenBao traffic to stay internal via hz.247 L4 gateway (10.0.1.10:443 -> orchestrator Traefik).
      - "s3cr3ts.neanelu.ro:10.0.1.10"
    volumes:
      # Agent configuration
      - ../config/openbao/agent-workers.hcl:/openbao/config/agent-workers.hcl:ro
      - ../config/openbao/templates:/openbao/templates:ro
      # Secrets output volume (shared with Workers services)
      - ${CERNIQ_RENDERED_SECRETS_DIR:-/opt/cerniq/runtime-secrets}/workers:/secrets
      # AppRole credentials (populated by setup script)
      - ../../secrets/workers_role_id:/openbao/config/role_id:ro
      - ../../secrets/workers_secret_id:/openbao/config/secret_id:ro
    networks:
      - cerniq_backend
    healthcheck:
      # Check if secrets file exists (template rendered)
      test: ["CMD", "test", "-f", "/secrets/workers.env"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"
        reservations:
          memory: 64M
          cpus: "0.1"
    labels:
      <<: *common-labels
      com.cerniq.service: "openbao-agent-workers"
    logging:
      <<: *default-logging

  # ==========================================================================
  # OpenBao Agent - Infra Sidecar (PgBouncer auth/config)
  # ==========================================================================
  openbao-agent-infra:
    image: quay.io/openbao/openbao:2.5.0
    container_name: cerniq-openbao-agent-infra
    restart: unless-stopped
    pid: "service:pgbouncer"
    user: "1000:1000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETGID
      - SETUID
    command: agent -config=/openbao/config/agent-infra.hcl
    environment:
      CERNIQ_ENV: ${CERNIQ_ENV:-staging}
    extra_hosts:
      # Force OpenBao traffic to stay internal via hz.247 L4 gateway (10.0.1.10:443 -> orchestrator Traefik).
      - "s3cr3ts.neanelu.ro:10.0.1.10"
    volumes:
      - ../config/openbao/agent-infra.hcl:/openbao/config/agent-infra.hcl:ro
      - ../config/openbao/templates:/openbao/templates:ro
      - ${CERNIQ_RENDERED_SECRETS_DIR:-/opt/cerniq/runtime-secrets}/infra:/secrets
      - ../../secrets/infra_role_id:/openbao/config/role_id:ro
      - ../../secrets/infra_secret_id:/openbao/config/secret_id:ro
    networks:
      - cerniq_backend
    healthcheck:
      test: ["CMD", "test", "-f", "/secrets/pgbouncer.ini"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"
        reservations:
          memory: 64M
          cpus: "0.1"
    labels:
      <<: *common-labels
      com.cerniq.service: "openbao-agent-infra"
    logging:
      <<: *default-logging

  # ==========================================================================
  # OpenBao Agent — Sonar token pentru CI / tooling (opțional, profil ci-sonar)
  # ==========================================================================
  # Randează SONAR_TOKEN în ${CERNIQ_RENDERED_SECRETS_DIR}/ci/sonar.env
  # Necesită: secrets/cicd_role_id + secrets/cicd_secret_id (AppRole cerniq-cicd, în afara git).
  # Self-hosted runner: poate monta același director ca în workflow (fără secret GitHub SONAR_TOKEN).
  # ==========================================================================
  openbao-agent-ci-sonar:
    profiles:
      - ci-sonar
    image: quay.io/openbao/openbao:2.5.0
    container_name: cerniq-openbao-agent-ci-sonar
    restart: "no"
    user: "1000:1000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETGID
      - SETUID
    command: agent -config=/openbao/config/agent-ci-sonar.hcl
    extra_hosts:
      - "s3cr3ts.neanelu.ro:10.0.1.10"
    volumes:
      - ../config/openbao/agent-ci-sonar.hcl:/openbao/config/agent-ci-sonar.hcl:ro
      - ../config/openbao/templates:/openbao/templates:ro
      - ${CERNIQ_RENDERED_SECRETS_DIR:-/opt/cerniq/runtime-secrets}/ci:/secrets
      - ../../secrets/cicd_role_id:/openbao/config/role_id:ro
      - ../../secrets/cicd_secret_id:/openbao/config/secret_id:ro
    networks:
      - cerniq_backend
    healthcheck:
      test: ["CMD", "test", "-f", "/secrets/sonar.env"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    labels:
      <<: *common-labels
      com.cerniq.service: "openbao-agent-ci-sonar"
    logging:
      <<: *default-logging

  # ==========================================================================
  # PgBouncer Exporter — Prometheus metrics for PgBouncer
  # ==========================================================================
  # Exports SHOW STATS/POOLS/DATABASES from PgBouncer admin console.
  # Scraped by orchestrator Prometheus via HAProxy (port 64095).
  # ==========================================================================
  pgbouncer-exporter:
    image: prometheuscommunity/pgbouncer-exporter:v0.11.1
    container_name: cerniq-pgbouncer-exporter
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    user: "1000:1000"
    volumes:
      - ${CERNIQ_RENDERED_SECRETS_DIR:-/opt/cerniq/runtime-secrets}/infra/userlist.txt:/secrets/userlist.txt:ro
    entrypoint:
      - /bin/sh
      - -c
      - |
        USER=$$(head -1 /secrets/userlist.txt | cut -d'"' -f2)
        PASS=$$(head -1 /secrets/userlist.txt | cut -d'"' -f4)
        exec /bin/pgbouncer_exporter \
          --pgBouncer.connectionString="postgres://$${USER}:$${PASS}@172.29.30.11:64033/pgbouncer?sslmode=disable&connect_timeout=10" \
          --web.listen-address=":9127"
    ports:
      - "64095:9127"
    networks:
      cerniq_data:
        ipv4_address: 172.29.30.15
    depends_on:
      pgbouncer:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9127/metrics"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: "0.1"
    labels:
      <<: *common-labels
      com.cerniq.service: "pgbouncer-exporter"
      com.cerniq.port: "64095"
    logging:
      <<: *default-logging

  # ==========================================================================
  # REMOVED: vector, otel-collector
  # Observability is centralized on the orchestrator (77.42.76.185):
  #   - Vector   → collects Docker logs → Loki → StorageBox
  #   - OTEL Collector → receives OTLP traces → Tempo
  #   - Prometheus → scrapes cAdvisor + node-exporter from CTs via HAProxy
  # Applications will send OTLP directly to otel-cerniq.neanelu.ro
  # Container logs shipped via Docker Loki log driver (configured in daemon.json)
  # ==========================================================================

  cadvisor:
    # NOTE: version tags are not consistently published on gcr.io; use latest.
    # If you need strict pinning, replace with an image digest after pull.
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: cerniq-cadvisor
    restart: unless-stopped
    privileged: false
    security_opt:
      - no-new-privileges:true
    ports:
      - "64094:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    networks:
      - cerniq_backend
    labels:
      <<: *common-labels
      com.cerniq.service: "cadvisor"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      <<: *default-logging
