# =============================================================================
# Cerniq.app - Development Docker Compose Override
# =============================================================================
# ALL environments (dev/staging/production) use OpenBao from orchestrator
# for secrets management. No hardcoded credentials anywhere.
#
# Dev-specific: hot-reload volumes, debug ports, build from source
# =============================================================================

services:
  cerniq-api:
    build:
      context: ../../
      dockerfile: apps/api/Dockerfile.dev
    volumes:
      - ../../apps/api/src:/app/apps/api/src
      - ../../packages:/app/packages
      - ${CERNIQ_RENDERED_SECRETS_DIR:-../../runtime-secrets}/api:/secrets:ro
    ports:
      - "64010:64010"
      - "9229:9229"
    environment:
      - NODE_ENV=development
      - LOG_LEVEL=debug
      - PORT=64010
      - SECRETS_PATH=/secrets/api.env

  cerniq-web:
    build:
      context: ../../
      dockerfile: apps/web/Dockerfile
    command: pnpm --filter @cerniq/web dev
    volumes:
      - ../../apps/web/src:/app/apps/web/src
    ports:
      - "64000:64000"
    environment:
      - NODE_ENV=development

  cerniq-admin:
    build:
      context: ../../
      dockerfile: apps/web-admin/Dockerfile
    command: pnpm --filter @cerniq/web-admin dev
    volumes:
      - ../../apps/web-admin/src:/app/apps/web-admin/src
    ports:
      - "64012:64012"
    environment:
      - NODE_ENV=development

  cerniq-monitoring-api:
    build:
      context: ../../
      dockerfile: apps/monitoring-api/Dockerfile
    volumes:
      - ../../apps/monitoring-api/src:/app/apps/monitoring-api/src
      - ${CERNIQ_RENDERED_SECRETS_DIR:-../../runtime-secrets}/api:/secrets:ro
    ports:
      - "64080:64080"
    environment:
      - NODE_ENV=development
      - LOG_LEVEL=debug
      - PORT=64080
      - SECRETS_PATH=/secrets/api.env
