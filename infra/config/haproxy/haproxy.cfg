global
  log /dev/log local0
  log /dev/log local1 notice
  chroot /var/lib/haproxy
  stats socket /run/haproxy/admin.sock mode 660 level admin expose-fd listeners
  stats timeout 30s
  user haproxy
  group haproxy
  daemon

  # Keep defaults conservative.
  maxconn 2000

defaults
  log global
  mode tcp
  option tcplog
  timeout connect 5s
  timeout client  60s
  timeout server  60s

# ============================================================================
# Cerniq internal gateways (hz.247)
# ============================================================================
# Goal: keep all intra-cluster traffic internal, and work around VLAN4000 <->
# vSwitch TCP handshake issues by proxying through hz.247.
#
# IPs:
# - hz.247 gateway VIP: 10.0.1.10
# - orchestrator:       10.0.0.2
# - CT109 (prod):       10.0.1.109
# - CT110 (staging):    10.0.1.110
# ============================================================================

# --- CT -> orchestrator (TLS via Traefik) ---
frontend cerniq_orch_tls_in
  bind 10.0.1.10:443
  default_backend cerniq_orch_tls_out

backend cerniq_orch_tls_out
  source 10.0.1.10
  server orch 10.0.0.2:443 check

# --- CT -> orchestrator (Redis shared) ---
frontend cerniq_redis_in
  bind 10.0.1.10:6379
  default_backend cerniq_redis_out

backend cerniq_redis_out
  source 10.0.1.10
  server redis 10.0.0.2:6379 check

# --- orchestrator -> CT110 (staging) pull proxy ---
# node-exporter
frontend cerniq_ct110_node_exporter_in
  bind 10.0.1.10:19100
  default_backend cerniq_ct110_node_exporter_out

backend cerniq_ct110_node_exporter_out
  source 10.0.1.10
  server ct110 10.0.1.110:9100 check

# cadvisor (docker metrics)
frontend cerniq_ct110_cadvisor_in
  bind 10.0.1.10:19094
  default_backend cerniq_ct110_cadvisor_out

backend cerniq_ct110_cadvisor_out
  source 10.0.1.10
  server ct110 10.0.1.110:64094 check

# web/api/admin ports (internal service validation from orchestrator)
frontend cerniq_ct110_web_in
  bind 10.0.1.10:19000
  default_backend cerniq_ct110_web_out

backend cerniq_ct110_web_out
  source 10.0.1.10
  server ct110 10.0.1.110:64000 check

frontend cerniq_ct110_api_in
  bind 10.0.1.10:19010
  default_backend cerniq_ct110_api_out

backend cerniq_ct110_api_out
  source 10.0.1.10
  server ct110 10.0.1.110:64010 check

frontend cerniq_ct110_admin_in
  bind 10.0.1.10:19012
  default_backend cerniq_ct110_admin_out

backend cerniq_ct110_admin_out
  source 10.0.1.10
  server ct110 10.0.1.110:64012 check

