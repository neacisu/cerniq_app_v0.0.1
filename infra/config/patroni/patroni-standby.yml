# Patroni — exemplu standby (CT108). Aceleași `scope` și `namespace` ca primary-ul.
#
# Alăturare la cluster existent: NU re-bootstrapați un al doilea cluster cu același `scope`;
# folosiți procedura Patroni pentru nod replica (clone din leader / `create_replica_methods`) după ce
# prima instanță (CT107) a inițializat DCS-ul. Detalii: docs/runbooks/patroni-failover.md
# și https://patroni.readthedocs.io/

scope: cerniq-pg
namespace: /service/cerniq-pg/
name: ct108-standby

restapi:
  listen: 0.0.0.0:8008
  connect_address: 10.0.1.108:8008

etcd3:
  hosts: ct108-etcd:2379

postgresql:
  listen: 0.0.0.0:5432
  connect_address: 10.0.1.108:5432
  data_dir: /var/lib/postgresql/18/main
  pg_hba:
    - host replication replicator 10.0.1.0/24 scram-sha-256
    - host all all 10.0.1.0/24 scram-sha-256
