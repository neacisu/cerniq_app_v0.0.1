# Patroni — exemplu primary (CT107). DCS: etcd3 pe cluster dedicat (ex. ct108-etcd:2379).
# Deploy: instalați Patroni + PostgreSQL 18 pe host; ajustați data_dir, pg_hba, replicator user.
# Referință: docs/runbooks/patroni-failover.md

scope: cerniq-pg
namespace: /service/cerniq-pg/
name: ct107-primary

restapi:
  listen: 0.0.0.0:8008
  connect_address: 10.0.1.107:8008

etcd3:
  hosts: ct108-etcd:2379

bootstrap:
  dcs:
    ttl: 30
    loop_wait: 10
    retry_timeout: 10
    maximum_lag_on_failover: 1048576
    postgresql:
      use_pg_rewind: true
      parameters:
        wal_level: replica
        max_wal_senders: 5
        max_replication_slots: 5
        hot_standby: "on"
        archive_mode: "on"

postgresql:
  listen: 0.0.0.0:5432
  connect_address: 10.0.1.107:5432
  data_dir: /var/lib/postgresql/18/main
  pg_hba:
    - host replication replicator 10.0.1.0/24 scram-sha-256
    - host all all 10.0.1.0/24 scram-sha-256
