# =============================================================================
# Redis Sentinel — referință + port (Cerniq)
# =============================================================================
# Configurația EFECTIVĂ la runtime NU este citită din acest fișier în Docker:
# `infra/scripts/redis-sentinel-entrypoint.sh` generează /tmp/sentinel.conf din variabile
# (REDIS_PASSWORD, REDIS_SENTINEL_NAME, REDIS_MASTER_HOST, REDIS_SENTINEL_QUORUM).
#
# Conținut echivalent (Redis 8):
#
#   port 26379
#   bind 0.0.0.0
#   sentinel monitor <REDIS_SENTINEL_NAME> <REDIS_MASTER_HOST> 6379 <quorum>
#   sentinel down-after-milliseconds <name> 5000
#   sentinel failover-timeout <name> 10000
#   sentinel parallel-syncs <name> 1
#   sentinel auth-pass <name> <REDIS_PASSWORD>
#
# Quorum: cu 1 proces Sentinel în compose, folosiți quorum 1. Cu 3 sentinei, quorum 2.
# Master: în rețeaua Docker numele serviciului este cerniq-redis-master (DNS).
# =============================================================================

port 26379
bind 0.0.0.0
