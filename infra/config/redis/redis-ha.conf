# Redis HA — master/replica (Cerniq). Parola: --requirepass la pornire (OpenBao / REDIS_PASSWORD).
# Montat în containerele cerniq-redis-master / cerniq-redis-replica.

bind 0.0.0.0
port 6379
tcp-backlog 511
timeout 0
tcp-keepalive 300

maxmemory 2gb
maxmemory-policy allkeys-lru

appendonly yes
appendfsync everysec

repl-diskless-sync yes
protected-mode no
