groups:
  - name: cerniq-infra
    rules:
      - alert: CerniqNodeDown
        expr: up{job=~"cerniq-nodes|cerniq-docker",project="cerniq"} == 0
        for: 2m
        labels:
          severity: critical
          project: cerniq
        annotations:
          summary: "Cerniq target down"
          description: "Prometheus scrape is down for {{ $labels.job }} / {{ $labels.instance }}"

      - alert: CerniqDiskLow
        expr: |
          (
            node_filesystem_avail_bytes{job="cerniq-nodes",project="cerniq",fstype!~"tmpfs|overlay"}
            / node_filesystem_size_bytes{job="cerniq-nodes",project="cerniq",fstype!~"tmpfs|overlay"}
          ) < 0.15
        for: 10m
        labels:
          severity: warning
          project: cerniq
        annotations:
          summary: "Cerniq disk low (<15%)"
          description: "Disk free is below 15% on {{ $labels.instance }} (mount={{ $labels.mountpoint }})"

      - alert: CerniqDiskCritical
        expr: |
          (
            node_filesystem_avail_bytes{job="cerniq-nodes",project="cerniq",fstype!~"tmpfs|overlay"}
            / node_filesystem_size_bytes{job="cerniq-nodes",project="cerniq",fstype!~"tmpfs|overlay"}
          ) < 0.05
        for: 5m
        labels:
          severity: critical
          project: cerniq
        annotations:
          summary: "Cerniq disk CRITICAL (<5%) — PostgreSQL crash risk"
          description: |
            Disk free is below 5% on {{ $labels.instance }} (mount={{ $labels.mountpoint }}).
            IMMEDIATE ACTION REQUIRED: CT107 crashed on 2026-03-25 due to disk 100% from WAL accumulation.
            Run: ssh root@10.0.1.107 pg_archivecleanup /var/lib/postgresql/18/main/pg_wal <REDO_WAL_from_pg_controldata>

      - alert: CerniqPostgresWalDirLarge
        expr: |
          node_filesystem_avail_bytes{job="cerniq-nodes",project="cerniq",mountpoint="/",instance="10.0.1.107:9100"}
          < 20 * 1024 * 1024 * 1024
        for: 15m
        labels:
          severity: warning
          project: cerniq
          host: ct107-postgres-main
        annotations:
          summary: "CT107 PostgreSQL: less than 20GB free — WAL accumulation risk"
          description: |
            CT107 (10.0.1.107) has less than 20GB free disk. WAL spike risk.
            Check: ssh root@10.0.1.107 'du -sh /var/lib/postgresql/18/main/pg_wal/'
            If excessive: pg_archivecleanup after verifying all WAL is archived in pgbackrest.

      - alert: CerniqMemoryLow
        expr: |
          (
            node_memory_MemAvailable_bytes{job="cerniq-nodes",project="cerniq"}
            / node_memory_MemTotal_bytes{job="cerniq-nodes",project="cerniq"}
          ) < 0.10
        for: 10m
        labels:
          severity: warning
          project: cerniq
        annotations:
          summary: "Cerniq memory low (<10% available)"
          description: "Memory available is below 10% on {{ $labels.instance }}"

      - alert: CerniqContainerRestarting
        expr: increase(container_restart_count{project="cerniq"}[15m]) > 0
        for: 5m
        labels:
          severity: warning
          project: cerniq
        annotations:
          summary: "Cerniq container restarting"
          description: "Container {{ $labels.name }} has restarted in the last 15m"

      - alert: PgBouncerPoolExhausted
        expr: pgbouncer_pool_client_wait_ratio > 0.9 or pgbouncer_pools_cl_active >= pgbouncer_pools_max_client_conn
        for: 5m
        labels:
          severity: critical
          project: cerniq
        annotations:
          summary: "PgBouncer pool near or at capacity"
          description: "PgBouncer connection pool exhausted or high wait ratio"

      - alert: RedisMemoryHigh
        expr: redis_memory_used_bytes / redis_memory_max_bytes > 0.9
        for: 10m
        labels:
          severity: warning
          project: cerniq
        annotations:
          summary: "Redis memory usage high (>90%)"
          description: "Redis memory usage is above 90% on {{ $labels.instance }}"

      # Profil redis-ha: master fără replică conectată (redis_exporter pe master).
      - alert: RedisReplicaMissing
        expr: redis_connected_slaves{job="cerniq-redis"} < 1 and up{job="cerniq-redis"} == 1
        for: 5m
        labels:
          severity: warning
          project: cerniq
        annotations:
          summary: "Redis master fără replică (sau lag de conectare)"
          description: "redis_connected_slaves < 1 pe job cerniq-redis. Verifică cerniq-redis-replica și rețeaua cerniq_data."

      # Metrici Sentinel (redis_exporter cu REDIS_EXPORTER_IS_SENTINEL). Nume metrică poate varia după versiune exporter.
      - alert: RedisSentinelFailover
        expr: increase(redis_sentinel_master_restarts_total{job="cerniq-redis-sentinel"}[10m]) > 0
        for: 0m
        labels:
          severity: warning
          project: cerniq
        annotations:
          summary: "Posibil failover Redis Sentinel"
          description: "Creștere redis_sentinel_master_restarts_total pe exporterul Sentinel. Verifică SENTINEL masters / logs."

      # Lag replicare (bytes): oliver006/redis_exporter v1.58+ (exporter pe master).
      # Aliniat pe `instance` (același țintă scrape). Fără sclavi, `min` e gol → fără alertă.
      - alert: RedisReplicaLag
        expr: |
          (
            avg by (instance) (redis_master_repl_offset{job="cerniq-redis"})
            -
            min by (instance) (redis_connected_slave_offset_bytes{job="cerniq-redis"})
          ) > 1048576
        for: 5m
        labels:
          severity: warning
          project: cerniq
        annotations:
          summary: "Lag replicare Redis > 1 MiB (master offset − min slave offset)"
          description: "Diferența dintre offset master și minimul offseturilor sclavilor depășește 1 MiB timp de 5m. Verifică rețea, disk replica, load."

      # Cel puțin un membru al clusterului trebuie să fie primary (vezi scrape dual CT107+CT108 în prometheus.yml).
      - alert: PatroniLeaderMissing
        expr: sum(patroni_primary{job="cerniq-patroni"}) < 1
        for: 1m
        labels:
          severity: critical
          project: cerniq
        annotations:
          summary: "Cluster Patroni fără primary (sau metrici lipsă)"
          description: "sum(patroni_primary) < 1 timp de 1m. Verificați etcd/DCS, `patronictl list`, conectivitate REST :8008 pe CT107/CT108."

      # Lag replicare (proxy în bytes): Patroni expune diff între received și replayed WAL pe replică.
      # Nu există `patroni_replica_lag_seconds` nativ; prag ~80MB timp de 5m — ajustați după încărcare.
      - alert: PatroniReplicaLag
        expr: |
          (
            patroni_xlog_received_location{job="cerniq-patroni"}
            -
            patroni_xlog_replayed_location{job="cerniq-patroni"}
          ) > 8e7
        for: 5m
        labels:
          severity: warning
          project: cerniq
        annotations:
          summary: "Lag replicare Patroni (WAL received − replayed) ridicat"
          description: "Diferență WAL > 80MB pe instanță. Verificați rețea, I/O standby, load primary."

      # Schimbare timeline = failover/switchover sau re-bootstrap (nu există counter `patroni_failover_total` în Patroni).
      - alert: PatroniFailover
        expr: max(changes(patroni_postgres_timeline{job="cerniq-patroni"}[10m])) > 0
        for: 0m
        labels:
          severity: critical
          project: cerniq
        annotations:
          summary: "Schimbare timeline PostgreSQL (Patroni) — failover/switchover sau reprovizionare"
          description: "Timeline Postgres s-a schimbat pe un nod. Verificați istoricul Patroni și aplicațiile."

      - alert: PatroniTargetDown
        expr: up{job="cerniq-patroni"} == 0
        for: 7d
        labels:
          severity: info
          project: cerniq
        annotations:
          summary: "Patroni /metrics indisponibil (prolongat)"
          description: "Scrape Patroni down 7d pe un target. Dacă Patroni nu e deployat pe acel host, eliminați target-ul din prometheus.yml."

      - alert: CircuitBreakerOpen
        expr: cerniq_circuit_breaker_state == 1
        for: 1m
        labels:
          severity: warning
          project: cerniq
        annotations:
          summary: "Circuit breaker deschis"
          description: "Provider {{ $labels.provider }} — apeluri externe respinse până la half-open/close."

      - alert: CircuitBreakerTripsHigh
        expr: increase(cerniq_circuit_breaker_trips_total[5m]) > 5
        for: 0m
        labels:
          severity: warning
          project: cerniq
        annotations:
          summary: "Multe deschideri de circuit breaker"
          description: "Peste 5 trip-uri în 5m pentru unul sau mai mulți provideri."

      - alert: DRTestStale
        expr: time() - backup_dr_test_last_success_timestamp > 2592000
        for: 1h
        labels:
          severity: warning
          project: cerniq
        annotations:
          summary: "Test DR lunar neexecutat (>30 zile)"
          description: "Rulați infra/scripts/dr-test-monthly.sh și/sau actualizați backup_dr_test_last_success_timestamp (textfile collector)."

      - alert: CerniqSecretsStale
        expr: cerniq_secrets_file_age_seconds{service="api"} > 7200
        for: 10m
        labels:
          severity: warning
          project: cerniq
        annotations:
          summary: "Rendered secrets file stale"
          description: "Secrets file age is above 2 hours for {{ $labels.service }}"

      - alert: CerniqSecretsReloadFailed
        expr: increase(cerniq_secrets_reload_total{service="api",status="failed"}[15m]) >= 3
        for: 0m
        labels:
          severity: critical
          project: cerniq
        annotations:
          summary: "Repeated secret reload failures"
          description: "API secrets reload failed at least 3 times in the last 15m"

      - alert: BackupFailed
        expr: time() - backup_health_check_last_success_timestamp > 86400
        for: 1h
        labels:
          severity: critical
          project: cerniq
        annotations:
          summary: "Backup health check has not succeeded in 24h"
          description: "Last successful backup check was more than 24 hours ago"

      - alert: CertExpiringSoon
        expr: (probe_ssl_earliest_cert_expiry - time()) / 86400 < 14
        for: 0m
        labels:
          severity: warning
          project: cerniq
        annotations:
          summary: "TLS certificate expiring in less than 14 days"
          description: "Certificate for {{ $labels.instance }} expires in {{ $value }} days"

      - alert: EnrichmentQueueDepthHigh
        expr: sum(cerniq_worker_queue_depth{queue=~"silver:.*|pipeline:.*"}) > 1000
        for: 10m
        labels:
          severity: warning
          project: cerniq
        annotations:
          summary: "Enrichment queue depth high"
          description: "Total enrichment/pipeline queue depth is above 1000 jobs for 10m"

      - alert: EnrichmentQueueDepthCritical
        expr: sum(cerniq_worker_queue_depth{queue=~"silver:.*|pipeline:.*"}) > 5000
        for: 5m
        labels:
          severity: critical
          project: cerniq
        annotations:
          summary: "Enrichment queue depth critical"
          description: "Total enrichment/pipeline queue depth is above 5000 jobs"

      - alert: EnrichmentFailureRateHigh
        expr: sum(rate(cerniq_worker_jobs_failed_total{queue=~"silver:.*|pipeline:.*"}[5m])) > 0.2
        for: 5m
        labels:
          severity: critical
          project: cerniq
        annotations:
          summary: "Enrichment worker failure rate high"
          description: "Failed jobs rate is above 0.2 jobs/sec on enrichment pipeline"

      - alert: HitlBacklogHigh
        expr: cerniq_worker_queue_depth{queue="pipeline:hitl-resume-after-approval"} > 100
        for: 10m
        labels:
          severity: warning
          project: cerniq
        annotations:
          summary: "HITL backlog high"
          description: "HITL resume queue backlog is above 100 jobs for 10m"

      - alert: HitlSlaBreach
        expr: increase(cerniq_hitl_sla_breach_total[1h]) > 0
        for: 0m
        labels:
          severity: warning
          project: cerniq
        annotations:
          summary: "HITL SLA breach detected"
          description: "{{ $value }} HITL tasks breached SLA in the last hour"

      - alert: EnrichmentStalled
        expr: |
          increase(cerniq_worker_jobs_processed_total{queue=~"silver:.*|pipeline:.*"}[30m]) == 0
          and
          sum(cerniq_worker_queue_depth{queue=~"silver:.*|pipeline:.*"}) > 0
        for: 15m
        labels:
          severity: critical
          project: cerniq
        annotations:
          summary: "Enrichment pipeline stalled"
          description: "No enrichment/pipeline jobs processed in 30m while queue depth remains non-zero"

      - alert: WorkerDown
        expr: up{job=~"cerniq-workers|cerniq-docker",project="cerniq"} == 0
        for: 2m
        labels:
          severity: critical
          project: cerniq
        annotations:
          summary: "Worker instance down"
          description: "Worker target {{ $labels.instance }} is not responding"

      - alert: HighJobFailureRate
        expr: |
          sum(rate(cerniq_worker_jobs_failed_total{queue=~"silver:.*|pipeline:.*"}[10m]))
          /
          clamp_min(sum(rate(cerniq_worker_jobs_processed_total{queue=~"silver:.*|pipeline:.*"}[10m])), 0.001)
          > 0.05
        for: 5m
        labels:
          severity: warning
          project: cerniq
        annotations:
          summary: "High enrichment job failure rate"
          description: "Enrichment/pipeline failure ratio exceeded 5% in the last 10m"

      - alert: PostgresHighConnections
        expr: |
          sum(pg_stat_activity_count{project="cerniq"})
          /
          clamp_min(sum(pg_settings_max_connections{project="cerniq"}), 1)
          > 0.8
        for: 5m
        labels:
          severity: warning
          project: cerniq
        annotations:
          summary: "PostgreSQL connections high"
          description: "PostgreSQL active connections exceeded 80% of max_connections"

      - alert: SlowQueries
        expr: pg_stat_statements_mean_time_seconds{project="cerniq"} > 5
        for: 10m
        labels:
          severity: warning
          project: cerniq
        annotations:
          summary: "Slow queries detected"
          description: "Mean query time above 5 seconds on {{ $labels.instance }}"

  - name: cerniq-llm
    rules:
      - alert: VLLMKVCacheHigh
        expr: vllm:gpu_cache_usage_perc{project="cerniq"} > 0.85
        for: 5m
        labels:
          severity: critical
          project: cerniq
        annotations:
          summary: "vLLM KV cache utilization critical (>85%)"
          description: "KV cache usage is {{ $value | humanizePercentage }} on {{ $labels.instance }} ({{ $labels.model }}). Requests may start queuing or being rejected."

      - alert: LLMPendingRequests
        expr: vllm:num_requests_waiting{project="cerniq"} > 20
        for: 5m
        labels:
          severity: warning
          project: cerniq
        annotations:
          summary: "vLLM pending requests high (>20)"
          description: "{{ $value }} requests waiting in queue on {{ $labels.instance }}. Consider scaling or rate limiting."

      - alert: VLLMTTFTDegradation
        expr: histogram_quantile(0.95, rate(vllm:time_to_first_token_seconds_bucket{project="cerniq"}[5m])) > 5
        for: 5m
        labels:
          severity: warning
          project: cerniq
        annotations:
          summary: "vLLM TTFT P95 degradation (>5s)"
          description: "Time to first token P95 is {{ $value }}s on {{ $labels.instance }}. Expected < 5s."

      - alert: LLMFailureRateHigh
        expr: |
          sum(rate(vllm:request_success_total{project="cerniq",finished="false"}[5m]))
          /
          clamp_min(sum(rate(vllm:request_success_total{project="cerniq"}[5m])), 0.001)
          > 0.05
        for: 5m
        labels:
          severity: critical
          project: cerniq
        annotations:
          summary: "LLM request failure rate high (>5%)"
          description: "LLM request failure rate is above 5% in the last 5 minutes"

      - alert: LLMEndpointDown
        expr: up{job=~"vllm-.*|ollama-.*",project="cerniq"} == 0
        for: 2m
        labels:
          severity: critical
          project: cerniq
        annotations:
          summary: "LLM endpoint unreachable"
          description: "LLM endpoint {{ $labels.instance }} ({{ $labels.job }}) is not responding to scrapes"

      - alert: LLMBudgetExceeded
        expr: increase(cerniq_llm_budget_exceeded_total[5m]) > 0
        for: 1m
        labels:
          severity: warning
          project: cerniq
        annotations:
          summary: "LLM daily budget hard cap hit (tenant frontier blocked)"
          description: "At least one tenant reached the daily LLM spend cap — check cerniq_llm_budget_exceeded_total labels."

  - name: cerniq-cognitive
    rules:
      - alert: NeuronStaleFiring
        expr: absent(increase(cerniq_worker_jobs_processed_total[5m]))
        for: 10m
        labels:
          severity: warning
          project: cerniq
        annotations:
          summary: "Worker job counters missing or stale (cognitive pipeline)"
          description: "Prometheus sees no cerniq_worker_jobs_processed_total series for increase(5m) — scrape or worker metrics may be absent."

      - alert: DeliberativeNeuronFail
        expr: |
          sum(rate(cerniq_worker_jobs_failed_total{queue=~"ai:.*"}[5m]))
          /
          clamp_min(sum(rate(cerniq_worker_jobs_processed_total{queue=~"ai:.*"}[5m])), 0.001)
          > 0.05
        for: 5m
        labels:
          severity: critical
          project: cerniq
        annotations:
          summary: "Deliberative (AI) worker failure rate above 5%"
          description: "Failed / processed ratio for queues matching ai:* exceeded 5% over 5m."

      - alert: GuardrailBreachSpike
        expr: sum(rate(cerniq_hitl_sla_breach_total[5m])) * 60 > 10
        for: 3m
        labels:
          severity: critical
          project: cerniq
        annotations:
          summary: "Guardrail / HITL SLA breach rate spike (>10/min)"
          description: "Estimated HITL SLA breaches per minute from cerniq_hitl_sla_breach_total exceeded 10 (5m rate × 60)."

      - alert: ANAFCacheHitRateLow
        expr: |
          sum(rate(cerniq_external_api_requests_total{provider="anaf",status!="success"}[10m]))
          /
          clamp_min(sum(rate(cerniq_external_api_requests_total{provider="anaf"}[10m])), 0.001)
          > 0.3
        for: 10m
        labels:
          severity: warning
          project: cerniq
        annotations:
          summary: "ANAF external API error rate above 30% (cache/API degraded)"
          description: "ANAF API call error ratio exceeded 30% over 10m — indicates cache misses combined with API unavailability."

      - alert: MutationWithoutProvenance
        expr: |
          sum(rate(cerniq_bronze_contacts_ingested[5m])) > 0
          and
          sum(rate(cerniq_import_mutation_total[5m])) == 0
        for: 10m
        labels:
          severity: warning
          project: cerniq
        annotations:
          summary: "Bronze contacts ingested but zero DB mutations tracked (provenance gap)"
          description: "cerniq_bronze_contacts_ingested is positive while cerniq_import_mutation_total rate is 0 — mutations may lack provenance tracking."

      - alert: DLQDepthGrowing
        expr: sum by (queue) (cerniq_worker_dlq_depth) > 5
        for: 5m
        labels:
          severity: warning
          project: cerniq
        annotations:
          summary: "Dead Letter Queue depth above 5 (node retry exhaustion)"
          description: "Queue {{ $labels.queue }} DLQ has {{ $value }} items — jobs exhausted all retries and are accumulating."

      - alert: CronQuotaResetMissing
        expr: |
          min_over_time(sum by (phone_id) (cerniq_outreach_wa_quota_usage)[25h:5m]) > 50
        for: 30m
        labels:
          severity: warning
          project: cerniq
        annotations:
          summary: "WA quota usage never reset in 25h (cron may have missed)"
          description: "Phone {{ $labels.phone_id }} quota usage minimum over 25h is {{ $value }} — expected daily reset to near-zero did not occur."

      - alert: SynapseBreachThreshold
        expr: |
          count(
            sum by (queue) (rate(cerniq_worker_jobs_failed_total[5m])) > 0.1
          ) > 3
        for: 5m
        labels:
          severity: critical
          project: cerniq
        annotations:
          summary: "More than 3 queues simultaneously failing at >0.1 jobs/s (synapse breach)"
          description: "{{ $value }} worker queues have failure rate above 0.1 jobs/sec — multi-queue failure indicates systemic synapse degradation."

      - alert: GoldNeuronBlocked
        expr: |
          histogram_quantile(
            0.95,
            sum(rate(cerniq_pipeline_company_stage_duration_seconds_bucket[5m])) by (le)
          ) > 86400
        for: 30m
        labels:
          severity: warning
          project: cerniq
        annotations:
          summary: "Pipeline company stage P95 duration > 24h (Gold neuron blocked)"
          description: "P95 company pipeline stage duration exceeded 24h — indicates companies are stuck in enrichment/gold promotion path."

      - alert: NodeRetryExhausted
        expr: |
          sum(rate(cerniq_worker_jobs_retried_total[5m]))
          /
          clamp_min(sum(rate(cerniq_worker_jobs_processed_total[5m])), 0.001)
          > 0.5
        for: 10m
        labels:
          severity: warning
          project: cerniq
        annotations:
          summary: "Node retry ratio above 50% (retries near exhaustion)"
          description: "Ratio of retried / processed jobs exceeded 50% over 5m — nodes are consuming retry budget and may reach DLQ soon."

      - alert: ConfigPendingApply
        expr: |
          histogram_quantile(
            0.95,
            sum(rate(cerniq_hitl_resolution_time_seconds_bucket[1h])) by (le)
          ) > 86400
        for: 30m
        labels:
          severity: warning
          project: cerniq
        annotations:
          summary: "HITL task P95 resolution time > 24h (config change pending apply)"
          description: "HITL resolution time P95 exceeded 24h — node config changes or approval tasks remain unresolved, blocking pipeline progress."

      - alert: CompanyPipelineStuck
        expr: |
          histogram_quantile(
            0.99,
            sum(rate(cerniq_pipeline_company_stage_duration_seconds_bucket[2h])) by (le)
          ) > 86400
        for: 30m
        labels:
          severity: critical
          project: cerniq
        annotations:
          summary: "Company pipeline P99 stage duration > 24h (pipeline stuck)"
          description: "P99 company stage transition time exceeded 24h over a 2h window — at least 1% of companies are stuck in the enrichment pipeline."

      - alert: QuotaExhausted
        expr: max by (phone_id, tenant_id) (cerniq_outreach_wa_quota_usage) > 900
        for: 5m
        labels:
          severity: critical
          project: cerniq
        annotations:
          summary: "WA quota usage above 900 for phone {{ $labels.phone_id }} (quota near exhaustion)"
          description: "Phone {{ $labels.phone_id }} (tenant {{ $labels.tenant_id }}) has {{ $value }} WA messages used — approaching daily limit, outreach will be throttled."

      - alert: PhoneBanned
        expr: cerniq_outreach_phone_status{status="ACTIVE"} == 0
        for: 5m
        labels:
          severity: critical
          project: cerniq
        annotations:
          summary: "WA phone {{ $labels.phone_id }} status ACTIVE=0 (banned / suspended)"
          description: "Phone {{ $labels.phone_id }} (tenant {{ $labels.tenant_id }}) reported ACTIVE=0 — phone may be banned, suspended, or offline. Outreach stopped for this phone."

      - alert: EInvoiceDeadlineRisk
        expr: |
          increase(cerniq_hitl_sla_breach_total{approval_type=~"einvoice.*|invoice.*|e-invoice.*"}[1h]) > 0
        for: 0m
        labels:
          severity: critical
          project: cerniq
        annotations:
          summary: "e-Invoice HITL SLA breached (deadline risk)"
          description: "HITL task of type {{ $labels.approval_type }} breached SLA — e-Invoice submission deadline may be at risk. Immediate review required."

      - alert: DeliberativeNeuronCostCap
        expr: |
          sum(cerniq_worker_queue_depth{queue=~"ai:.*"}) > 200
          and
          sum(rate(cerniq_worker_jobs_processed_total{queue=~"ai:.*"}[10m])) < 0.01
        for: 10m
        labels:
          severity: critical
          project: cerniq
        annotations:
          summary: "AI queue backed up with near-zero throughput (cost cap / rate limit)"
          description: "AI worker queues have {{ $value }} jobs waiting but processed rate dropped below 0.01 jobs/s — indicates LLM cost cap, rate limiting, or deliberative neuron stall."
