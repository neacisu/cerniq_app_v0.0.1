groups:
  - name: cerniq-infra
    rules:
      - alert: CerniqNodeDown
        expr: up{job=~"cerniq-nodes|cerniq-docker",project="cerniq"} == 0
        for: 2m
        labels:
          severity: critical
          project: cerniq
        annotations:
          summary: "Cerniq target down"
          description: "Prometheus scrape is down for {{ $labels.job }} / {{ $labels.instance }}"

      - alert: CerniqDiskLow
        expr: |
          (
            node_filesystem_avail_bytes{job="cerniq-nodes",project="cerniq",fstype!~"tmpfs|overlay"}
            / node_filesystem_size_bytes{job="cerniq-nodes",project="cerniq",fstype!~"tmpfs|overlay"}
          ) < 0.15
        for: 10m
        labels:
          severity: warning
          project: cerniq
        annotations:
          summary: "Cerniq disk low (<15%)"
          description: "Disk free is below 15% on {{ $labels.instance }} (mount={{ $labels.mountpoint }})"

      - alert: CerniqDiskCritical
        expr: |
          (
            node_filesystem_avail_bytes{job="cerniq-nodes",project="cerniq",fstype!~"tmpfs|overlay"}
            / node_filesystem_size_bytes{job="cerniq-nodes",project="cerniq",fstype!~"tmpfs|overlay"}
          ) < 0.05
        for: 5m
        labels:
          severity: critical
          project: cerniq
        annotations:
          summary: "Cerniq disk CRITICAL (<5%) — PostgreSQL crash risk"
          description: |
            Disk free is below 5% on {{ $labels.instance }} (mount={{ $labels.mountpoint }}).
            IMMEDIATE ACTION REQUIRED: CT107 crashed on 2026-03-25 due to disk 100% from WAL accumulation.
            Run: ssh root@10.0.1.107 pg_archivecleanup /var/lib/postgresql/18/main/pg_wal <REDO_WAL_from_pg_controldata>

      - alert: CerniqPostgresWalDirLarge
        expr: |
          node_filesystem_avail_bytes{job="cerniq-nodes",project="cerniq",mountpoint="/",instance="10.0.1.107:9100"}
          < 20 * 1024 * 1024 * 1024
        for: 15m
        labels:
          severity: warning
          project: cerniq
          host: ct107-postgres-main
        annotations:
          summary: "CT107 PostgreSQL: less than 20GB free — WAL accumulation risk"
          description: |
            CT107 (10.0.1.107) has less than 20GB free disk. WAL spike risk.
            Check: ssh root@10.0.1.107 'du -sh /var/lib/postgresql/18/main/pg_wal/'
            If excessive: pg_archivecleanup after verifying all WAL is archived in pgbackrest.

      - alert: CerniqMemoryLow
        expr: |
          (
            node_memory_MemAvailable_bytes{job="cerniq-nodes",project="cerniq"}
            / node_memory_MemTotal_bytes{job="cerniq-nodes",project="cerniq"}
          ) < 0.10
        for: 10m
        labels:
          severity: warning
          project: cerniq
        annotations:
          summary: "Cerniq memory low (<10% available)"
          description: "Memory available is below 10% on {{ $labels.instance }}"

      - alert: CerniqContainerRestarting
        expr: increase(container_restart_count{project="cerniq"}[15m]) > 0
        for: 5m
        labels:
          severity: warning
          project: cerniq
        annotations:
          summary: "Cerniq container restarting"
          description: "Container {{ $labels.name }} has restarted in the last 15m"

      - alert: PgBouncerPoolExhausted
        expr: pgbouncer_pool_client_wait_ratio > 0.9 or pgbouncer_pools_cl_active >= pgbouncer_pools_max_client_conn
        for: 5m
        labels:
          severity: critical
          project: cerniq
        annotations:
          summary: "PgBouncer pool near or at capacity"
          description: "PgBouncer connection pool exhausted or high wait ratio"

      - alert: RedisMemoryHigh
        expr: redis_memory_used_bytes / redis_memory_max_bytes > 0.9
        for: 10m
        labels:
          severity: warning
          project: cerniq
        annotations:
          summary: "Redis memory usage high (>90%)"
          description: "Redis memory usage is above 90% on {{ $labels.instance }}"

      - alert: CerniqSecretsStale
        expr: cerniq_secrets_file_age_seconds{service="api"} > 7200
        for: 10m
        labels:
          severity: warning
          project: cerniq
        annotations:
          summary: "Rendered secrets file stale"
          description: "Secrets file age is above 2 hours for {{ $labels.service }}"

      - alert: CerniqSecretsReloadFailed
        expr: increase(cerniq_secrets_reload_total{service="api",status="failed"}[15m]) >= 3
        for: 0m
        labels:
          severity: critical
          project: cerniq
        annotations:
          summary: "Repeated secret reload failures"
          description: "API secrets reload failed at least 3 times in the last 15m"

      - alert: BackupFailed
        expr: time() - backup_health_check_last_success_timestamp > 86400
        for: 1h
        labels:
          severity: critical
          project: cerniq
        annotations:
          summary: "Backup health check has not succeeded in 24h"
          description: "Last successful backup check was more than 24 hours ago"

      - alert: CertExpiringSoon
        expr: (probe_ssl_earliest_cert_expiry - time()) / 86400 < 14
        for: 0m
        labels:
          severity: warning
          project: cerniq
        annotations:
          summary: "TLS certificate expiring in less than 14 days"
          description: "Certificate for {{ $labels.instance }} expires in {{ $value }} days"

      - alert: EnrichmentQueueDepthHigh
        expr: sum(cerniq_worker_queue_depth{queue=~"silver:.*|pipeline:.*"}) > 1000
        for: 10m
        labels:
          severity: warning
          project: cerniq
        annotations:
          summary: "Enrichment queue depth high"
          description: "Total enrichment/pipeline queue depth is above 1000 jobs for 10m"

      - alert: EnrichmentQueueDepthCritical
        expr: sum(cerniq_worker_queue_depth{queue=~"silver:.*|pipeline:.*"}) > 5000
        for: 5m
        labels:
          severity: critical
          project: cerniq
        annotations:
          summary: "Enrichment queue depth critical"
          description: "Total enrichment/pipeline queue depth is above 5000 jobs"

      - alert: EnrichmentFailureRateHigh
        expr: sum(rate(cerniq_worker_jobs_failed_total{queue=~"silver:.*|pipeline:.*"}[5m])) > 0.2
        for: 5m
        labels:
          severity: critical
          project: cerniq
        annotations:
          summary: "Enrichment worker failure rate high"
          description: "Failed jobs rate is above 0.2 jobs/sec on enrichment pipeline"

      - alert: HitlBacklogHigh
        expr: cerniq_worker_queue_depth{queue="pipeline:hitl-resume-after-approval"} > 100
        for: 10m
        labels:
          severity: warning
          project: cerniq
        annotations:
          summary: "HITL backlog high"
          description: "HITL resume queue backlog is above 100 jobs for 10m"

      - alert: HitlSlaBreach
        expr: increase(cerniq_hitl_sla_breach_total[1h]) > 0
        for: 0m
        labels:
          severity: warning
          project: cerniq
        annotations:
          summary: "HITL SLA breach detected"
          description: "{{ $value }} HITL tasks breached SLA in the last hour"

      - alert: EnrichmentStalled
        expr: |
          increase(cerniq_worker_jobs_processed_total{queue=~"silver:.*|pipeline:.*"}[30m]) == 0
          and
          sum(cerniq_worker_queue_depth{queue=~"silver:.*|pipeline:.*"}) > 0
        for: 15m
        labels:
          severity: critical
          project: cerniq
        annotations:
          summary: "Enrichment pipeline stalled"
          description: "No enrichment/pipeline jobs processed in 30m while queue depth remains non-zero"

      - alert: WorkerDown
        expr: up{job=~"cerniq-workers|cerniq-docker",project="cerniq"} == 0
        for: 2m
        labels:
          severity: critical
          project: cerniq
        annotations:
          summary: "Worker instance down"
          description: "Worker target {{ $labels.instance }} is not responding"

      - alert: HighJobFailureRate
        expr: |
          sum(rate(cerniq_worker_jobs_failed_total{queue=~"silver:.*|pipeline:.*"}[10m]))
          /
          clamp_min(sum(rate(cerniq_worker_jobs_processed_total{queue=~"silver:.*|pipeline:.*"}[10m])), 0.001)
          > 0.05
        for: 5m
        labels:
          severity: warning
          project: cerniq
        annotations:
          summary: "High enrichment job failure rate"
          description: "Enrichment/pipeline failure ratio exceeded 5% in the last 10m"

      - alert: PostgresHighConnections
        expr: |
          sum(pg_stat_activity_count{project="cerniq"})
          /
          clamp_min(sum(pg_settings_max_connections{project="cerniq"}), 1)
          > 0.8
        for: 5m
        labels:
          severity: warning
          project: cerniq
        annotations:
          summary: "PostgreSQL connections high"
          description: "PostgreSQL active connections exceeded 80% of max_connections"

      - alert: SlowQueries
        expr: pg_stat_statements_mean_time_seconds{project="cerniq"} > 5
        for: 10m
        labels:
          severity: warning
          project: cerniq
        annotations:
          summary: "Slow queries detected"
          description: "Mean query time above 5 seconds on {{ $labels.instance }}"

  - name: cerniq-llm
    rules:
      - alert: VLLMKVCacheHigh
        expr: vllm:gpu_cache_usage_perc{project="cerniq"} > 0.85
        for: 5m
        labels:
          severity: critical
          project: cerniq
        annotations:
          summary: "vLLM KV cache utilization critical (>85%)"
          description: "KV cache usage is {{ $value | humanizePercentage }} on {{ $labels.instance }} ({{ $labels.model }}). Requests may start queuing or being rejected."

      - alert: LLMPendingRequests
        expr: vllm:num_requests_waiting{project="cerniq"} > 20
        for: 5m
        labels:
          severity: warning
          project: cerniq
        annotations:
          summary: "vLLM pending requests high (>20)"
          description: "{{ $value }} requests waiting in queue on {{ $labels.instance }}. Consider scaling or rate limiting."

      - alert: VLLMTTFTDegradation
        expr: histogram_quantile(0.95, rate(vllm:time_to_first_token_seconds_bucket{project="cerniq"}[5m])) > 5
        for: 5m
        labels:
          severity: warning
          project: cerniq
        annotations:
          summary: "vLLM TTFT P95 degradation (>5s)"
          description: "Time to first token P95 is {{ $value }}s on {{ $labels.instance }}. Expected < 5s."

      - alert: LLMFailureRateHigh
        expr: |
          sum(rate(vllm:request_success_total{project="cerniq",finished="false"}[5m]))
          /
          clamp_min(sum(rate(vllm:request_success_total{project="cerniq"}[5m])), 0.001)
          > 0.05
        for: 5m
        labels:
          severity: critical
          project: cerniq
        annotations:
          summary: "LLM request failure rate high (>5%)"
          description: "LLM request failure rate is above 5% in the last 5 minutes"

      - alert: LLMEndpointDown
        expr: up{job=~"vllm-.*|ollama-.*",project="cerniq"} == 0
        for: 2m
        labels:
          severity: critical
          project: cerniq
        annotations:
          summary: "LLM endpoint unreachable"
          description: "LLM endpoint {{ $labels.instance }} ({{ $labels.job }}) is not responding to scrapes"

  - name: cerniq-cognitive
    rules:
      - alert: NeuronStaleFiring
        expr: absent(increase(cerniq_worker_jobs_processed_total[5m]))
        for: 10m
        labels:
          severity: warning
          project: cerniq
        annotations:
          summary: "Worker job counters missing or stale (cognitive pipeline)"
          description: "Prometheus sees no cerniq_worker_jobs_processed_total series for increase(5m) — scrape or worker metrics may be absent."

      - alert: DeliberativeNeuronFail
        expr: |
          sum(rate(cerniq_worker_jobs_failed_total{queue=~"ai:.*"}[5m]))
          /
          clamp_min(sum(rate(cerniq_worker_jobs_processed_total{queue=~"ai:.*"}[5m])), 0.001)
          > 0.05
        for: 5m
        labels:
          severity: critical
          project: cerniq
        annotations:
          summary: "Deliberative (AI) worker failure rate above 5%"
          description: "Failed / processed ratio for queues matching ai:* exceeded 5% over 5m."

      - alert: GuardrailBreachSpike
        expr: sum(rate(cerniq_hitl_sla_breach_total[5m])) * 60 > 10
        for: 3m
        labels:
          severity: critical
          project: cerniq
        annotations:
          summary: "Guardrail / HITL SLA breach rate spike (>10/min)"
          description: "Estimated HITL SLA breaches per minute from cerniq_hitl_sla_breach_total exceeded 10 (5m rate × 60)."
