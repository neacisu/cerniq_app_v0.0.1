global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
  - /etc/prometheus/rules/infra-*.yml
  - /etc/prometheus/rules/etapa3.yml
  - /etc/prometheus/rules/etapa4.yml
  - /etc/prometheus/rules/etapa5.yml
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090
  - job_name: node-exporter
    static_configs:
      - targets:
          - node-exporter:9100
  - job_name: cadvisor
    static_configs:
      - targets:
          - cadvisor:8080
  - job_name: blackbox-proxmox-tcp
    metrics_path: /probe
    params:
      module:
        - tcp_connect
    static_configs:
      - targets:
          - 10.0.0.2:8006
          - 10.0.1.10:8006
          - 10.0.1.11:8006
          - 10.0.1.12:8006
          - 10.0.0.2:22
          - 10.0.1.10:22
          - 10.0.1.11:22
          - 10.0.1.12:22
          - 142.132.132.20:445
    relabel_configs:
      - source_labels:
          - __address__
        target_label: __param_target
      - source_labels:
          - __param_target
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
  - job_name: pve-exporter
    metrics_path: /pve
    params:
      module:
        - default
      cluster:
        - "1"
      node:
        - "1"
    static_configs:
      - targets:
          - 10.0.1.10
          - 10.0.1.11
          - 10.0.1.12
    relabel_configs:
      - source_labels:
          - __address__
        target_label: __param_target
      - source_labels:
          - __param_target
        target_label: instance
      - target_label: __address__
        replacement: pve-exporter:9221
  - job_name: cerniq-nodes
    static_configs:
      - targets:
          - 10.0.1.10:29100
          - 10.0.1.10:19100
          - 10.0.1.107:9100
          - 10.0.1.108:9100
        labels:
          project: cerniq
    relabel_configs:
      - source_labels:
          - __address__
        target_label: instance
        regex: 10\.0\.1\.10:29100
        replacement: 10.0.1.109:9100
      - source_labels:
          - __address__
        target_label: instance
        regex: 10\.0\.1\.10:19100
        replacement: 10.0.1.110:9100
      - source_labels:
          - __address__
        target_label: environment
        regex: 10\.0\.1\.10:29100
        replacement: production
      - source_labels:
          - __address__
        target_label: environment
        regex: 10\.0\.1\.10:19100
        replacement: staging
  - job_name: cerniq-docker
    static_configs:
      - targets:
          - 10.0.1.10:29094
          - 10.0.1.10:19094
        labels:
          project: cerniq
    relabel_configs:
      - source_labels:
          - __address__
        target_label: instance
        regex: 10\.0\.1\.10:29094
        replacement: 10.0.1.109:64094
      - source_labels:
          - __address__
        target_label: instance
        regex: 10\.0\.1\.10:19094
        replacement: 10.0.1.110:64094
      - source_labels:
          - __address__
        target_label: environment
        regex: 10\.0\.1\.10:29094
        replacement: production
      - source_labels:
          - __address__
        target_label: environment
        regex: 10\.0\.1\.10:19094
        replacement: staging
  - job_name: cerniq-pgbouncer
    static_configs:
      - targets:
          - 10.0.1.10:29095
          - 10.0.1.10:19095
        labels:
          project: cerniq
    relabel_configs:
      - source_labels:
          - __address__
        target_label: instance
        regex: 10\.0\.1\.10:29095
        replacement: ct109-prod:64095
      - source_labels:
          - __address__
        target_label: instance
        regex: 10\.0\.1\.10:19095
        replacement: ct110-staging:64095
      - source_labels:
          - __address__
        target_label: environment
        regex: 10\.0\.1\.10:29095
        replacement: production
      - source_labels:
          - __address__
        target_label: environment
        regex: 10\.0\.1\.10:19095
        replacement: staging
  - job_name: cerniq-postgres
    static_configs:
      - targets:
          - 10.0.1.107:9187
        labels:
          project: cerniq
    relabel_configs:
      - source_labels:
          - __address__
        target_label: instance
        replacement: ct107-postgres:9187

  # Redis HA (profil docker compose `redis-ha`): master + Sentinel — aceleași rețele ca serviciile scrape-uite.
  - job_name: cerniq-redis
    scrape_interval: 15s
    metrics_path: /metrics
    static_configs:
      - targets:
          - cerniq-redis-exporter:9121
        labels:
          project: cerniq
          redis_role: master
    relabel_configs:
      - source_labels:
          - __address__
        target_label: instance
        replacement: cerniq-redis-exporter:9121

  - job_name: cerniq-redis-sentinel
    scrape_interval: 15s
    metrics_path: /metrics
    static_configs:
      - targets:
          - cerniq-redis-sentinel-exporter:9121
        labels:
          project: cerniq
          redis_role: sentinel
    relabel_configs:
      - source_labels:
          - __address__
        target_label: instance
        replacement: cerniq-redis-sentinel-exporter:9121

  # Patroni REST /metrics — câte un țintă per nod Patroni (CT107 primary + CT108 standby).
  # Altfel `sum(patroni_primary)` dintr-un singur scrape poate fi 0 pe replică chiar dacă clusterul are leader.
  - job_name: cerniq-patroni
    scrape_interval: 15s
    metrics_path: /metrics
    static_configs:
      - targets:
          - 10.0.1.107:8008
          - 10.0.1.108:8008
        labels:
          project: cerniq
    relabel_configs:
      - source_labels:
          - __address__
        target_label: instance
        regex: 10\.0\.1\.107:8008
        replacement: patroni-ct107:8008
      - source_labels:
          - __address__
        target_label: instance
        regex: 10\.0\.1\.108:8008
        replacement: patroni-ct108:8008

  - job_name: vllm-reasoning
    scrape_interval: 15s
    metrics_path: /metrics
    static_configs:
      - targets:
          - infraq.app:443
        labels:
          project: cerniq
          model: reasoning
          model_id: Qwen/QwQ-32B-AWQ
    scheme: https
    tls_config:
      insecure_skip_verify: false
    relabel_configs:
      - target_label: __metrics_path__
        replacement: /llm/v1/reasoning/metrics
      - source_labels:
          - __address__
        target_label: instance
        replacement: vllm-reasoning
  - job_name: vllm-fast
    scrape_interval: 15s
    metrics_path: /metrics
    static_configs:
      - targets:
          - infraq.app:443
        labels:
          project: cerniq
          model: fast
          model_id: Qwen/Qwen2.5-14B-Instruct-AWQ
    scheme: https
    tls_config:
      insecure_skip_verify: false
    relabel_configs:
      - target_label: __metrics_path__
        replacement: /llm/v1/fast/metrics
      - source_labels:
          - __address__
        target_label: instance
        replacement: vllm-fast
  - job_name: ollama-embeddings
    scrape_interval: 30s
    metrics_path: /metrics
    static_configs:
      - targets:
          - infraq.app:443
        labels:
          project: cerniq
          model: embeddings
          model_id: qwen3-embedding-8b-q5km
    scheme: https
    tls_config:
      insecure_skip_verify: false
    relabel_configs:
      - target_label: __metrics_path__
        replacement: /llm/v1/embeddings/metrics
      - source_labels:
          - __address__
        target_label: instance
        replacement: ollama-embeddings

  # ── Cerniq API (prom-client /metrics) — HAProxy 10.0.1.10 → CT109/CT110 :64010
  - job_name: cerniq-api
    scrape_interval: 15s
    metrics_path: /metrics
    static_configs:
      - targets:
          - 10.0.1.10:29010
          - 10.0.1.10:19010
        labels:
          project: cerniq
          service: cerniq-api
    relabel_configs:
      - source_labels:
          - __address__
        target_label: instance
        regex: 10\.0\.1\.10:29010
        replacement: ct109-prod:64010
      - source_labels:
          - __address__
        target_label: instance
        regex: 10\.0\.1\.10:19010
        replacement: ct110-staging:64010
      - source_labels:
          - __address__
        target_label: environment
        regex: 10\.0\.1\.10:29010
        replacement: production
      - source_labels:
          - __address__
        target_label: environment
        regex: 10\.0\.1\.10:19010
        replacement: staging

  # ── Monitoring API (prom-client /metrics) — rețea Docker backend
  - job_name: cerniq-monitoring-api
    scrape_interval: 15s
    metrics_path: /metrics
    static_configs:
      - targets:
          - cerniq-monitoring-api:64080
        labels:
          project: cerniq
          service: cerniq-monitoring-api
          environment: production

  # ── E3 AI Sales Worker — FAZA 12 / Plan §XII (familii metrici E3 AI + negociere; vezi e3-metrics.ts)
  # Scrape: workers/e3-ai-sales createHealthServer — PORT implicit 3002 (vezi main.ts)
  # Nume serviciu țintă Docker: cerniq-worker-e3-ai-sales (aliniat E4/E5)
  - job_name: cerniq-worker-e3-ai-sales
    scrape_interval: 15s
    metrics_path: /metrics
    static_configs:
      - targets:
          - cerniq-worker-e3-ai-sales:3002
        labels:
          project: cerniq
          etapa: E3
          service: worker-e3-ai-sales

  # ── E4 Post-Sale Workers — FAZA 8i (Plan §IX L2137) ─────────────────────────
  # Scrape target: worker-e4-postsale:3000/metrics (via createHealthServer, PORT=3000)
  # Service name matches Docker Compose service: cerniq-worker-e4-postsale
  - job_name: cerniq-worker-e4-postsale
    scrape_interval: 15s
    metrics_path: /metrics
    static_configs:
      - targets:
          - cerniq-worker-e4-postsale:3000
        labels:
          project: cerniq
          etapa: E4
          service: worker-e4-postsale

  # ── E5 Nurturing Worker — FAZA 9b (Plan §X L2224) ────────────────────────────
  # Scrape target: cerniq-worker-e5-nurturing:3000/metrics
  # Service name matches Docker Compose service: cerniq-worker-e5-nurturing
  - job_name: cerniq-worker-e5-nurturing
    scrape_interval: 15s
    metrics_path: /metrics
    static_configs:
      - targets:
          - cerniq-worker-e5-nurturing:3000
        labels:
          project: cerniq
          etapa: E5
          service: worker-e5-nurturing
