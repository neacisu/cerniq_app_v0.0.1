# =============================================================================
# CERNIQ.APP — CI Pipeline for Pull Requests and Pushes
# =============================================================================
# Workflow: ci-pr.yml
# Trigger: Push to main/develop, Pull Requests to main/develop
# Purpose: Lint, Test, Security Scan, Docker Build Verification
#
# FAIL-FAST: Every job cancels the entire workflow run on failure.
# This prevents wasting runner time when a check has already failed.
#
# Reference: ADR-0107 CI/CD Pipeline Strategy
# Created: 2026-02-01
# =============================================================================

name: CI Pipeline

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
      - "feat/**"
      - "fix/**"
      - "hotfix/**"
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

env:
  NODE_VERSION: "25.8.1"
  PNPM_VERSION: "10.32.1"
  PYTHON_VERSION: "3.14.3"

jobs:
  # ===========================================================================
  # JOB 1: Linting & Type Checking
  # ===========================================================================
  lint:
    name: 🔍 Lint & Type Check
    runs-on: self-hosted
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: 📥 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🔍 Run ESLint
        run: pnpm lint

      - name: 🎨 Prettier format check
        run: pnpm prettier --check .

      - name: 📝 TypeScript Type Check
        run: pnpm typecheck

      - name: ☁️ Verify SonarCloud config (lcov paths + chei obligatorii)
        run: pnpm verify:sonar-config

      - name: 🔧 Smoke test scripturi audit (Node)
        run: node --test tests/infra/audit-metadata-scripts.test.mjs tests/infra/sonar-token-from-rendered-env.test.mjs tests/infra/k6-load-scripts.test.mjs tests/infra/chaos-artifacts.test.mjs tests/infra/run-vitest-ci-packages.test.mjs tests/infra/pgtap-artifacts.test.mjs

      - name: ❌ Cancel workflow on failure
        if: failure()
        run: gh run cancel ${{ github.run_id }}
        env:
          GH_TOKEN: ${{ github.token }}

  # ==========================================================================
  # JOB 2: Full Test Suite (Unit + Integration + E2E)
  # ==========================================================================
  test:
    name: 🧪 Tests
    runs-on: self-hosted
    timeout-minutes: 15
    permissions:
      contents: read
      actions: write
    services:
      postgres:
        image: postgis/postgis:18-3.6
        env:
          POSTGRES_USER: c3rn1q
          POSTGRES_DB: cerniq
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 64032:5432
        options: >-
          --security-opt apparmor=unconfined
          --health-cmd "pg_isready -U c3rn1q"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:8.6.0
        ports:
          - 64039:6379
        options: >-
          --security-opt apparmor=unconfined
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: 📥 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🧰 Ensure jq is available
        run: |
          if ! command -v jq >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y jq
          fi

      - name: 🔐 Fetch CI secrets from OpenBao
        env:
          OPENBAO_ADDR: ${{ secrets.OPENBAO_ADDR }}
          OPENBAO_CICD_ROLE_ID: ${{ secrets.OPENBAO_CICD_ROLE_ID }}
          OPENBAO_CICD_SECRET_ID: ${{ secrets.OPENBAO_CICD_SECRET_ID }}
        run: |
          set -euo pipefail

          if ! command -v jq >/dev/null 2>&1; then
            echo "jq not found on runner. Install jq and retry." >&2
            exit 1
          fi

          require_value() {
            local name="$1"
            local value="$2"
            if [ -z "$value" ] || [ "$value" = "null" ]; then
              echo "OpenBao secret missing: $name" >&2
              exit 1
            fi
          }

          require_value "OPENBAO_ADDR" "$OPENBAO_ADDR"
          require_value "OPENBAO_CICD_ROLE_ID" "$OPENBAO_CICD_ROLE_ID"
          require_value "OPENBAO_CICD_SECRET_ID" "$OPENBAO_CICD_SECRET_ID"

          if ! curl -sS --fail --retry 5 --retry-connrefused --retry-delay 2 --max-time 10 \
            "${OPENBAO_ADDR}/v1/sys/health" >/dev/null; then
            echo "OpenBao not reachable at OPENBAO_ADDR" >&2
            exit 1
          fi

          TOKEN=$(curl -sS --fail --retry 5 --retry-connrefused --retry-delay 2 --max-time 10 \
            -X POST "${OPENBAO_ADDR}/v1/auth/approle/login" \
            -d "{\"role_id\":\"${OPENBAO_CICD_ROLE_ID}\",\"secret_id\":\"${OPENBAO_CICD_SECRET_ID}\"}" \
            | jq -r '.auth.client_token')

          require_value "OPENBAO_TOKEN" "$TOKEN"

          SECRETS=$(curl -sS --fail --retry 5 --retry-connrefused --retry-delay 2 --max-time 10 \
            -H "X-Vault-Token: $TOKEN" \
            "${OPENBAO_ADDR}/v1/secret/cerniq/ci/test")

          CI_PG_USER=$(echo "$SECRETS" | jq -r '.data.pg_user')
          CI_JWT_SECRET=$(echo "$SECRETS" | jq -r '.data.jwt_secret')

          require_value "pg_user" "$CI_PG_USER"
          if [ "$CI_PG_USER" != "c3rn1q" ]; then
            echo "OpenBao CI pg_user must be c3rn1q to match service container" >&2
            exit 1
          fi
          require_value "jwt_secret" "$CI_JWT_SECRET"

          echo "::add-mask::$CI_JWT_SECRET"

          echo "DATABASE_URL=postgresql://${CI_PG_USER}@localhost:64032/cerniq" >> $GITHUB_ENV
          echo "POSTGRES_USER=${CI_PG_USER}" >> $GITHUB_ENV
          echo "REDIS_URL=redis://localhost:64039/0" >> $GITHUB_ENV
          echo "JWT_SECRET=${CI_JWT_SECRET}" >> $GITHUB_ENV

      - name: 📂 Ensure workspace directories exist
        run: mkdir -p secrets test-results

      - name: 🗄️ Drizzle migrate + pgTAP (dacă extensia pgtap e în clusterul Postgres)
        run: |
          set -euo pipefail
          pnpm db:migrate
          if [[ "$(psql "$DATABASE_URL" -tAc "SELECT 1 FROM pg_available_extensions WHERE name = 'pgtap' LIMIT 1" 2>/dev/null || true)" != "1" ]]; then
            echo "::notice title=pgTAP::Extensia pgtap nu e disponibilă în imaginea Postgres CI (normal pentru postgis/postgis fără pgtap). Sar suite-ul SQL."
            exit 0
          fi
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "CREATE EXTENSION IF NOT EXISTS pgtap;"
          bash infra/scripts/run-pgtap.sh

      - name: 📐 Verify Vitest coverage thresholds (API + web)
        run: pnpm verify:coverage-policy

      - name: 🧪 Run Full Test Suite
        run: pnpm test:coverage
        env:
          WORKSPACE_ROOT: ${{ github.workspace }}

      - name: 📊 Coverage summary (job summary)
        if: always()
        run: node infra/scripts/coverage-job-summary.mjs >> "$GITHUB_STEP_SUMMARY"

      - name: 🧾 Run tests with JSON report
        run: pnpm test:ci
        env:
          WORKSPACE_ROOT: ${{ github.workspace }}

      - name: 📦 Upload test results artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results
          if-no-files-found: ignore

      - name: 📊 Upload Coverage Report
        uses: codecov/codecov-action@v4
        if: always()
        continue-on-error: true
        with:
          fail_ci_if_error: false

      - name: 📤 Upload LCOV for SonarCloud
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-lcov
          path: |
            apps/web/coverage/lcov.info
            apps/api/coverage/lcov.info
          if-no-files-found: ignore

      - name: ❌ Cancel workflow on failure
        if: failure()
        run: gh run cancel ${{ github.run_id }}
        env:
          GH_TOKEN: ${{ github.token }}

  # ==========================================================================
  # JOB 3: Build Verification
  # ==========================================================================
  build-verify:
    name: 🧱 Build Verification
    runs-on: self-hosted
    timeout-minutes: 15
    permissions:
      contents: read
      actions: write

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: 📥 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🧱 Run Build
        run: pnpm build

      - name: ❌ Cancel workflow on failure
        if: failure()
        run: gh run cancel ${{ github.run_id }}
        env:
          GH_TOKEN: ${{ github.token }}

  # ==========================================================================
  # JOB 4: Security Scan
  # ==========================================================================
  security:
    name: 🔒 Security Scan
    runs-on: self-hosted
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: 📥 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🔒 Setup Trivy
        uses: aquasecurity/setup-trivy@v0.2.6
        with:
          version: v0.69.1
          cache: true

      - name: 🔒 Run Trivy vulnerability scanner
        run: |
          trivy fs . \
            --scanners vuln \
            --severity CRITICAL,HIGH \
            --exit-code 1 \
            --ignore-unfixed \
            --skip-dirs secrets,.pnpm-store,node_modules \
            --ignorefile .trivyignore \
            --format table

      - name: 🔍 Audit npm dependencies
        run: pnpm audit --audit-level=high

      - name: ❌ Cancel workflow on failure
        if: failure()
        run: gh run cancel ${{ github.run_id }}
        env:
          GH_TOKEN: ${{ github.token }}

  # ===========================================================================
  # JOB 5: Docker Configuration Validation
  # ===========================================================================
  docker-config:
    name: 🐳 Docker Config Validation
    runs-on: self-hosted
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔎 Validate daemon.json syntax
        run: |
          if [ -f "./infra/config/docker/daemon.json" ]; then
            echo "✅ Validating daemon.json syntax..."
            python3 -m json.tool ./infra/config/docker/daemon.json > /dev/null
            echo "✅ daemon.json is valid JSON"
          else
            echo "⏭️ daemon.json not found (optional)"
          fi

      - name: ❌ Cancel workflow on failure
        if: failure()
        run: gh run cancel ${{ github.run_id }}
        env:
          GH_TOKEN: ${{ github.token }}

  # ===========================================================================
  # JOB 6: ShellCheck (infra/scripts/*.sh)
  # ===========================================================================
  shellcheck:
    name: 🐚 ShellCheck
    runs-on: self-hosted
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐚 Run ShellCheck
        run: |
          set -euo pipefail
          set -- ./infra/scripts/*.sh
          if [ ! -e "$1" ]; then
            echo "No ./infra/scripts/*.sh found, skipping"
            exit 0
          fi
          if command -v shellcheck >/dev/null 2>&1; then
            shellcheck -x "$@"
          else
            FILES=$(find ./infra/scripts -maxdepth 1 -type f -name '*.sh' -printf '/mnt/%P ')
            docker run --rm --security-opt apparmor=unconfined -v "$PWD:/mnt" koalaman/shellcheck:stable -x $FILES
          fi

      - name: 🔎 Validate docker-compose.yml
        run: |
          if [ -f "./infra/docker/docker-compose.yml" ]; then
            echo "✅ Validating docker-compose.yml..."
            STUB_DIR="$(pwd)/.ci-stub-secrets"
            mkdir -p "${STUB_DIR}"/{api,workers,infra,ci}
            touch "${STUB_DIR}/api/api.env" \
                  "${STUB_DIR}/workers/workers.env" \
                  "${STUB_DIR}/infra/userlist.txt" \
                  "${STUB_DIR}/infra/pgbouncer.ini" \
                  "${STUB_DIR}/ci/sonar.env"
            CERNIQ_RENDERED_SECRETS_DIR="${STUB_DIR}" \
              docker compose -f ./infra/docker/docker-compose.yml config --quiet
            rm -rf "${STUB_DIR}"
            echo "✅ docker-compose.yml is valid"
          else
            echo "⏭️ docker-compose.yml not found (optional)"
          fi

      - name: 🔎 Check shell scripts syntax
        run: |
          echo "✅ Validating shell scripts..."
          for script in ./infra/scripts/*.sh; do
            if [ -f "$script" ]; then
              bash -n "$script" && echo "  ✓ $script"
            fi
          done

      - name: 🔎 Verify network configuration (ADR-0015)
        run: |
          if [ -f "./infra/docker/docker-compose.yml" ]; then
            echo "✅ Checking network configuration..."
            for net in cerniq_public cerniq_backend cerniq_data; do
              if grep -q "$net:" ./infra/docker/docker-compose.yml; then
                echo "  ✓ Network $net defined"
              else
                echo "  ✗ Network $net missing!"
                exit 1
              fi
            done
            for net in cerniq_public cerniq_backend cerniq_data; do
              if grep -A2 "$net:" ./infra/docker/docker-compose.yml | grep -q "external: true"; then
                echo "  ✓ Network $net is external"
              else
                echo "  ⚠️ Network $net should be external: true"
              fi
            done
          fi

      - name: 🔎 Verify port allocation (ADR-0022)
        run: |
          if [ -f "./infra/docker/docker-compose.yml" ]; then
            echo "✅ Checking port allocation compliance..."
            INVALID_PORTS=$(grep -E "^\s+-\s+['\"]?[0-9]+:" ./infra/docker/docker-compose.yml | grep -vE "64[0-9]{3}:" | grep -v "#" || true)
            if [ -n "$INVALID_PORTS" ]; then
              echo "  ⚠️ Found ports outside 64000-64099 range:"
              echo "$INVALID_PORTS"
              echo "  (Review if these are intentional)"
            else
              echo "  ✓ All ports within 64000-64099 range"
            fi
          fi

      - name: ❌ Cancel workflow on failure
        if: failure()
        run: gh run cancel ${{ github.run_id }}
        env:
          GH_TOKEN: ${{ github.token }}

  # ===========================================================================
  # JOB 7: Docker Build Verification
  # ===========================================================================
  docker-build:
    name: 🐳 Docker Build
    runs-on: self-hosted
    timeout-minutes: 20
    needs: [lint, test]
    permissions:
      contents: read
      actions: write

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔎 Check for Dockerfiles
        id: check-dockerfiles
        run: |
          if [ -f "./apps/api/Dockerfile" ] && [ -f "./apps/web/Dockerfile" ] && [ -f "./apps/web-admin/Dockerfile" ] && [ -f "./apps/monitoring-api/Dockerfile" ]; then
            echo "dockerfiles_exist=true" >> $GITHUB_OUTPUT
          else
            echo "dockerfiles_exist=false" >> $GITHUB_OUTPUT
            echo "⏭️ Skipping Docker build - Dockerfiles not yet created"
          fi

      - name: 🐳 Set up Docker Buildx
        if: steps.check-dockerfiles.outputs.dockerfiles_exist == 'true'
        uses: docker/setup-buildx-action@v3

      - name: 🏗️ Build API image
        if: steps.check-dockerfiles.outputs.dockerfiles_exist == 'true'
        uses: docker/build-push-action@v6.19.2
        with:
          context: .
          file: ./apps/api/Dockerfile
          push: false
          tags: cerniq/api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 🏗️ Build Web image
        if: steps.check-dockerfiles.outputs.dockerfiles_exist == 'true'
        uses: docker/build-push-action@v6.19.2
        with:
          context: .
          file: ./apps/web/Dockerfile
          push: false
          tags: cerniq/web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 🏗️ Build Web Admin image
        if: steps.check-dockerfiles.outputs.dockerfiles_exist == 'true'
        uses: docker/build-push-action@v6.19.2
        with:
          context: .
          file: ./apps/web-admin/Dockerfile
          push: false
          tags: cerniq/web-admin:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 🏗️ Build Monitoring API image
        if: steps.check-dockerfiles.outputs.dockerfiles_exist == 'true'
        uses: docker/build-push-action@v6.19.2
        with:
          context: .
          file: ./apps/monitoring-api/Dockerfile
          push: false
          tags: cerniq/monitoring-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: ❌ Cancel workflow on failure
        if: failure()
        run: gh run cancel ${{ github.run_id }}
        env:
          GH_TOKEN: ${{ github.token }}

  # ==========================================================================
  # JOB 8: Detect changes for conditional jobs
  # ==========================================================================
  changes:
    name: 🧭 Detect Changes
    runs-on: self-hosted
    permissions:
      contents: read
      pull-requests: read
    outputs:
      workers: ${{ steps.filter.outputs.workers }}
      web: ${{ steps.filter.outputs.web }}
      api_or_load: ${{ steps.filter.outputs.api_or_load }}

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔎 Paths filter
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            workers:
              - 'workers/**'
            web:
              - 'apps/web/**'
            api_or_load:
              - 'apps/api/**'
              - 'tests/load/**'
              - '.github/workflows/ci-pr.yml'

  # ==========================================================================
  # JOB 9: Python Workers Lint (conditional — only when workers/ changed)
  # ==========================================================================
  python-lint:
    name: 🐍 Python Lint
    runs-on: self-hosted
    timeout-minutes: 10
    needs: changes
    if: needs.changes.outputs.workers == 'true'
    permissions:
      contents: read
      actions: write

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 📦 Install Python dependencies
        run: pip install ruff mypy

      - name: 🔍 Run Ruff linter
        run: ruff check workers/

      - name: 📝 Run mypy type check
        run: mypy workers/ --ignore-missing-imports
        continue-on-error: true

      - name: ❌ Cancel workflow on failure
        if: failure()
        run: gh run cancel ${{ github.run_id }}
        env:
          GH_TOKEN: ${{ github.token }}

  # ==========================================================================
  # JOB 9b: Playwright — smoke UI (doar la modificări apps/web)
  # ==========================================================================
  playwright-e2e:
    name: 🎭 Playwright (web smoke)
    runs-on: self-hosted
    timeout-minutes: 15
    needs: [lint, changes]
    if: needs.changes.outputs.web == 'true'
    permissions:
      contents: read
      actions: write

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: 📥 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🎭 Install Playwright Chromium
        run: cd apps/web && pnpm exec playwright install chromium --with-deps

      - name: 🎭 Run Playwright smoke
        env:
          PW_DISABLE_TS_ESM: "1"
        run: cd apps/web && pnpm exec playwright test --config playwright.config.cjs

      - name: 📎 Playwright — raport HTML și test-results (la eșec)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-e2e-failure
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: ignore

      - name: ❌ Cancel workflow on failure
        if: failure()
        run: gh run cancel ${{ github.run_id }}
        env:
          GH_TOKEN: ${{ github.token }}

  # ==========================================================================
  # JOB 9c: k6 — inspect scripturi (fără API live)
  # ==========================================================================
  k6-validate:
    name: 📈 k6 script inspect
    runs-on: self-hosted
    timeout-minutes: 5
    needs: changes
    if: needs.changes.outputs.api_or_load == 'true'
    permissions:
      contents: read

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔍 k6 inspect load scripts
        run: |
          docker run --rm -v "$PWD:/work" -w /work grafana/k6:0.57.0 inspect tests/load/api-health.k6.js
          docker run --rm -v "$PWD:/work" -w /work grafana/k6:0.57.0 inspect tests/load/api-enrichment.k6.js
          docker run --rm -v "$PWD:/work" -w /work grafana/k6:0.57.0 inspect tests/load/api-outreach.k6.js

  # ==========================================================================
  # JOB 9d: k6 — load efectiv (health, profil ciRamp ~5 min) + JSON pentru analiză
  # Necesită API accesibil la API_BASE (implicit host.docker.internal:64010).
  # Prag P95 health: K6_HEALTH_P95_MS (implicit 80ms în CI — ajustați vars.K6_HEALTH_P95_MS).
  # ==========================================================================
  k6-load-test:
    name: 📈 k6 load (health ciRamp)
    runs-on: self-hosted
    timeout-minutes: 15
    needs: [changes, lint]
    if: needs.changes.outputs.api_or_load == 'true'
    permissions:
      contents: read
      actions: write

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📂 Rezultate k6
        run: mkdir -p test-results

      - name: 📈 k6 run — api-health (K6_PROFILE=ciRamp)
        env:
          # fromJSON(toJSON(vars)) — același workaround ca la job sonarcloud (vscode-github-actions#222).
          K6_API_BASE_VAR: ${{ fromJSON(toJSON(vars)).K6_API_BASE }}
          K6_HEALTH_P95_MS_VAR: ${{ fromJSON(toJSON(vars)).K6_HEALTH_P95_MS }}
        run: |
          set -euo pipefail
          API_URL="${K6_API_BASE_VAR:-http://host.docker.internal:64010}"
          P95="${K6_HEALTH_P95_MS_VAR:-80}"
          echo "API_BASE=$API_URL K6_HEALTH_P95_MS=$P95"
          docker run --rm --add-host=host.docker.internal:host-gateway \
            -v "$PWD:/work" -w /work \
            -e K6_PROFILE=ciRamp \
            -e API_BASE="$API_URL" \
            -e K6_HEALTH_P95_MS="$P95" \
            grafana/k6:0.57.0 run \
            --summary-export=test-results/k6-load-summary.json \
            --out json=test-results/k6-load-results.json \
            tests/load/api-health.k6.js

      - name: 📎 Artefacte k6 load
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-load-metrics
          path: |
            test-results/k6-load-summary.json
            test-results/k6-load-results.json
          if-no-files-found: ignore

      - name: ❌ Cancel workflow on failure
        if: failure()
        run: gh run cancel ${{ github.run_id }}
        env:
          GH_TOKEN: ${{ github.token }}

  # ==========================================================================
  # JOB 10: SonarCloud (opțional — variabilă repo SONAR_SCAN=true + secret SONAR_TOKEN)
  # ==========================================================================
  sonarcloud:
    name: ☁️ SonarCloud
    runs-on: self-hosted
    timeout-minutes: 20
    needs: [test]
    # Notă: `env` nu e disponibil în `jobs.*.if` (evaluare înainte de contextul env al jobului).
    # Folosim `vars` — definește în repo: Settings → Actions → Variables → SONAR_SCAN = true
    # `fromJSON(toJSON(vars))` — workaround language server (fără schimbare semantică la runtime);
    # vezi github/vscode-github-actions#222 (avertisment „Context access might be invalid”).
    if: ${{ fromJSON(toJSON(vars)).SONAR_SCAN == 'true' }}
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📥 Download LCOV artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: coverage-lcov
          path: .

      - name: 🧰 Ensure jq is available
        run: |
          if ! command -v jq >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y jq
          fi

      - name: 🔐 Resolve SONAR_TOKEN (fișier agent OpenBao → API OpenBao → GitHub)
        env:
          OPENBAO_ADDR: ${{ secrets.OPENBAO_ADDR }}
          OPENBAO_CICD_ROLE_ID: ${{ secrets.OPENBAO_CICD_ROLE_ID }}
          OPENBAO_CICD_SECRET_ID: ${{ secrets.OPENBAO_CICD_SECRET_ID }}
          GH_SONAR_FALLBACK: ${{ fromJSON(toJSON(secrets)).SONAR_TOKEN }}
          CERNIQ_OPENBAO_SONAR_ENV_FILE: ${{ fromJSON(toJSON(vars)).CERNIQ_OPENBAO_SONAR_ENV_FILE }}
        run: |
          set -euo pipefail
          FINAL=""
          SONAR_FILE="${CERNIQ_OPENBAO_SONAR_ENV_FILE:-/opt/cerniq/runtime-secrets/ci/sonar.env}"
          if [ -f "$SONAR_FILE" ] && [ -r "$SONAR_FILE" ]; then
            set -a
            # shellcheck disable=SC1090
            . "$SONAR_FILE"
            set +a
            FINAL="${SONAR_TOKEN:-}"
          fi
          if [ -n "${OPENBAO_ADDR:-}" ] && [ -n "${OPENBAO_CICD_ROLE_ID:-}" ] && [ -n "${OPENBAO_CICD_SECRET_ID:-}" ]; then
            if curl -sS --fail --retry 3 --retry-connrefused --retry-delay 2 --max-time 15 \
              "${OPENBAO_ADDR}/v1/sys/health" >/dev/null 2>&1; then
              BAO_CLIENT=$(curl -sS --fail --retry 3 --retry-connrefused --retry-delay 2 --max-time 15 \
                -X POST "${OPENBAO_ADDR}/v1/auth/approle/login" \
                -d "{\"role_id\":\"${OPENBAO_CICD_ROLE_ID}\",\"secret_id\":\"${OPENBAO_CICD_SECRET_ID}\"}" \
                | jq -r '.auth.client_token')
              if [ -n "$BAO_CLIENT" ] && [ "$BAO_CLIENT" != "null" ]; then
                RAW=$(curl -sS --fail --retry 3 --retry-connrefused --retry-delay 2 --max-time 15 \
                  -H "X-Vault-Token: ${BAO_CLIENT}" \
                  "${OPENBAO_ADDR}/v1/secret/cerniq/ci/sonar")
                T=$(echo "$RAW" | jq -r '.data.token // empty')
                if [ -n "$T" ] && [ "$T" != "null" ]; then
                  if [ -z "$FINAL" ]; then
                    FINAL="$T"
                  fi
                fi
              fi
            fi
          fi
          if [ -z "$FINAL" ]; then
            FINAL="${GH_SONAR_FALLBACK:-}"
          fi
          if [ -z "$FINAL" ]; then
            echo "SONAR_TOKEN lipsă: agent OpenBao → \`$SONAR_FILE\`, sau KV \`secret/cerniq/ci/sonar\` (cheie token), sau secret GitHub \`SONAR_TOKEN\`." >&2
            exit 1
          fi
          echo "::add-mask::$FINAL"
          echo "SONAR_TOKEN=$FINAL" >> "$GITHUB_ENV"

      - name: ☁️ SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v4.2.1
        env:
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}

  # ===========================================================================
  # Final Status Check (for branch protection)
  # ===========================================================================
  ci-status:
    name: ✅ CI Status
    runs-on: self-hosted
    needs:
      [
        lint,
        test,
        build-verify,
        security,
        docker-config,
        docker-build,
        shellcheck,
        python-lint,
        playwright-e2e,
        k6-validate,
        k6-load-test,
        sonarcloud,
      ]
    if: always()

    steps:
      - name: Check CI Status
        run: |
          echo "📊 Job results:"
          echo "  lint:         ${{ needs.lint.result }}"
          echo "  test:         ${{ needs.test.result }}"
          echo "  build-verify: ${{ needs.build-verify.result }}"
          echo "  security:     ${{ needs.security.result }}"
          echo "  docker-config:${{ needs.docker-config.result }}"
          echo "  docker-build: ${{ needs.docker-build.result }}"
          echo "  shellcheck:   ${{ needs.shellcheck.result }}"
          echo "  python-lint:  ${{ needs.python-lint.result }}"
          echo "  playwright-e2e: ${{ needs.playwright-e2e.result }}"
          echo "  k6-validate: ${{ needs.k6-validate.result }}"
          echo "  k6-load-test: ${{ needs.k6-load-test.result }}"
          echo "  sonarcloud:   ${{ needs.sonarcloud.result }}"

          FAILED=0
          for job in lint test build-verify security docker-config docker-build shellcheck; do
            result=""
            case "$job" in
              lint)          result="${{ needs.lint.result }}" ;;
              test)          result="${{ needs.test.result }}" ;;
              build-verify)  result="${{ needs.build-verify.result }}" ;;
              security)      result="${{ needs.security.result }}" ;;
              docker-config) result="${{ needs.docker-config.result }}" ;;
              docker-build)  result="${{ needs.docker-build.result }}" ;;
              shellcheck)    result="${{ needs.shellcheck.result }}" ;;
            esac
            if [[ "$result" != "success" ]]; then
              echo "❌ Job '$job' did not succeed (result: $result)"
              FAILED=1
            fi
          done

          # python-lint is conditional (only runs when workers/ changed) — skipped is acceptable
          if [[ "${{ needs.python-lint.result }}" == "failure" ]] || \
             [[ "${{ needs.python-lint.result }}" == "cancelled" ]]; then
            echo "❌ Job 'python-lint' failed (result: ${{ needs.python-lint.result }})"
            FAILED=1
          fi

          if [[ "${{ needs.playwright-e2e.result }}" == "failure" ]] || \
             [[ "${{ needs.playwright-e2e.result }}" == "cancelled" ]]; then
            echo "❌ Job 'playwright-e2e' failed (result: ${{ needs.playwright-e2e.result }})"
            FAILED=1
          fi

          if [[ "${{ needs.k6-validate.result }}" == "failure" ]] || \
             [[ "${{ needs.k6-validate.result }}" == "cancelled" ]]; then
            echo "❌ Job 'k6-validate' failed (result: ${{ needs.k6-validate.result }})"
            FAILED=1
          fi

          if [[ "${{ needs.k6-load-test.result }}" == "failure" ]] || \
             [[ "${{ needs.k6-load-test.result }}" == "cancelled" ]]; then
            echo "❌ Job 'k6-load-test' failed (result: ${{ needs.k6-load-test.result }})"
            FAILED=1
          fi

          # sonarcloud rulează doar când variabila repo SONAR_SCAN=true — skipped e acceptabil
          if [[ "${{ needs.sonarcloud.result }}" == "failure" ]] || \
             [[ "${{ needs.sonarcloud.result }}" == "cancelled" ]]; then
            echo "❌ Job 'sonarcloud' failed (result: ${{ needs.sonarcloud.result }})"
            FAILED=1
          fi

          if [[ "$FAILED" -eq 1 ]]; then
            echo "❌ CI failed — CD will NOT be triggered"
            exit 1
          fi

          echo "✅ All CI checks passed"

  # ===========================================================================
  # Trigger CD Pipeline (only on push, after all CI checks pass)
  # ===========================================================================
  trigger-cd:
    name: 🚀 Trigger CD
    runs-on: self-hosted
    needs: ci-status
    if: >-
      github.event_name == 'push' &&
      needs.ci-status.result == 'success'

    steps:
      - name: 🚀 Trigger CD Pipeline
        run: |
          BRANCH="${{ github.ref_name }}"
          SHA="${{ github.sha }}"
          SHORT_SHA="${SHA:0:7}"

          if [[ "$BRANCH" == "main" ]]; then
            ENVIRONMENT="production"
            LATEST_TAG=$(gh api repos/${{ github.repository }}/tags --jq '.[].name' 2>/dev/null | grep '^v0\.0\.' | sort -V | tail -1)
            if [[ -z "$LATEST_TAG" ]]; then
              VERSION="v0.0.1"
            else
              PATCH=$(echo "$LATEST_TAG" | sed 's/v0\.0\.//')
              VERSION="v0.0.$((PATCH + 1))"
            fi
          else
            ENVIRONMENT="staging"
            SAFE_BRANCH=$(echo "$BRANCH" | sed 's/[^a-zA-Z0-9]/-/g' | cut -c1-20)
            VERSION="${SAFE_BRANCH}-${SHORT_SHA}"
          fi

          echo "🎯 Triggering CD: environment=$ENVIRONMENT version=$VERSION"
          gh workflow run deploy.yml \
            --ref "${{ github.ref }}" \
            -f environment="$ENVIRONMENT" \
            -f version="$VERSION"
        env:
          GH_TOKEN: ${{ github.token }}
