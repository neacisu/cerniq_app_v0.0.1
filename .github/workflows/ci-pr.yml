# =============================================================================
# CERNIQ.APP — CI Pipeline for Pull Requests and Pushes
# =============================================================================
# Workflow: ci-pr.yml
# Trigger: Push to main/develop, Pull Requests to main/develop
# Purpose: Lint, Test, Security Scan, Docker Build Verification
#
# FAIL-FAST: Every job cancels the entire workflow run on failure.
# This prevents wasting runner time when a check has already failed.
#
# Reference: ADR-0107 CI/CD Pipeline Strategy
# Created: 2026-02-01
# =============================================================================

name: CI Pipeline

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
      - "feat/**"
      - "fix/**"
      - "hotfix/**"
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write
  security-events: write

env:
  NODE_VERSION: "24.13.1"
  PNPM_VERSION: "10.29.3"
  PYTHON_VERSION: "3.14.3"

jobs:
  # ===========================================================================
  # JOB 1: Linting & Type Checking
  # ===========================================================================
  lint:
    name: 🔍 Lint & Type Check
    runs-on: self-hosted
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: 📥 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🔍 Run ESLint
        run: pnpm lint

      - name: 🎨 Prettier format check
        run: pnpm prettier --check .

      - name: 📝 TypeScript Type Check
        run: pnpm typecheck

      - name: ❌ Cancel workflow on failure
        if: failure()
        run: gh run cancel ${{ github.run_id }}
        env:
          GH_TOKEN: ${{ github.token }}

  # ==========================================================================
  # JOB 2: Full Test Suite (Unit + Integration + E2E)
  # ==========================================================================
  test:
    name: 🧪 Tests
    runs-on: self-hosted
    timeout-minutes: 15
    services:
      postgres:
        image: postgis/postgis:18-3.6
        env:
          POSTGRES_USER: c3rn1q
          POSTGRES_PASSWORD: cerniq_ci
          POSTGRES_DB: cerniq
        ports:
          - 64032:5432
        options: >-
          --security-opt apparmor=unconfined
          --health-cmd "pg_isready -U c3rn1q"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:8.6.0
        ports:
          - 64039:6379
        options: >-
          --security-opt apparmor=unconfined
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: 📥 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🧰 Ensure jq is available
        run: |
          if ! command -v jq >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y jq
          fi

      - name: 🔐 Fetch CI secrets from OpenBao
        env:
          OPENBAO_ADDR: ${{ secrets.OPENBAO_ADDR }}
          OPENBAO_CICD_ROLE_ID: ${{ secrets.OPENBAO_CICD_ROLE_ID }}
          OPENBAO_CICD_SECRET_ID: ${{ secrets.OPENBAO_CICD_SECRET_ID }}
        run: |
          set -euo pipefail

          if ! command -v jq >/dev/null 2>&1; then
            echo "jq not found on runner. Install jq and retry." >&2
            exit 1
          fi

          require_value() {
            local name="$1"
            local value="$2"
            if [ -z "$value" ] || [ "$value" = "null" ]; then
              echo "OpenBao secret missing: $name" >&2
              exit 1
            fi
          }

          require_value "OPENBAO_ADDR" "$OPENBAO_ADDR"
          require_value "OPENBAO_CICD_ROLE_ID" "$OPENBAO_CICD_ROLE_ID"
          require_value "OPENBAO_CICD_SECRET_ID" "$OPENBAO_CICD_SECRET_ID"

          if ! curl -sS --fail --retry 5 --retry-connrefused --retry-delay 2 --max-time 10 \
            "${OPENBAO_ADDR}/v1/sys/health" >/dev/null; then
            echo "OpenBao not reachable at OPENBAO_ADDR" >&2
            exit 1
          fi

          TOKEN=$(curl -sS --fail --retry 5 --retry-connrefused --retry-delay 2 --max-time 10 \
            -X POST "${OPENBAO_ADDR}/v1/auth/approle/login" \
            -d "{\"role_id\":\"${OPENBAO_CICD_ROLE_ID}\",\"secret_id\":\"${OPENBAO_CICD_SECRET_ID}\"}" \
            | jq -r '.auth.client_token')

          require_value "OPENBAO_TOKEN" "$TOKEN"

          SECRETS=$(curl -sS --fail --retry 5 --retry-connrefused --retry-delay 2 --max-time 10 \
            -H "X-Vault-Token: $TOKEN" \
            "${OPENBAO_ADDR}/v1/secret/cerniq/ci/test")

          CI_PG_USER=$(echo "$SECRETS" | jq -r '.data.pg_user')
          CI_PG_PASSWORD=$(echo "$SECRETS" | jq -r '.data.pg_password')
          CI_JWT_SECRET=$(echo "$SECRETS" | jq -r '.data.jwt_secret')

          require_value "pg_user" "$CI_PG_USER"
          require_value "pg_password" "$CI_PG_PASSWORD"
          if [ "$CI_PG_USER" != "c3rn1q" ]; then
            echo "OpenBao CI pg_user must be c3rn1q to match service container" >&2
            exit 1
          fi
          if [ "$CI_PG_PASSWORD" != "cerniq_ci" ]; then
            echo "OpenBao CI pg_password must match service container password" >&2
            exit 1
          fi
          require_value "jwt_secret" "$CI_JWT_SECRET"

          echo "::add-mask::$CI_PG_PASSWORD"
          echo "::add-mask::$CI_JWT_SECRET"

          echo "DATABASE_URL=postgresql://${CI_PG_USER}:${CI_PG_PASSWORD}@localhost:64032/cerniq" >> $GITHUB_ENV
          echo "POSTGRES_USER=${CI_PG_USER}" >> $GITHUB_ENV
          echo "POSTGRES_PASSWORD=${CI_PG_PASSWORD}" >> $GITHUB_ENV
          echo "REDIS_URL=redis://localhost:64039/0" >> $GITHUB_ENV
          echo "REDIS_PASSWORD=" >> $GITHUB_ENV
          echo "JWT_SECRET=${CI_JWT_SECRET}" >> $GITHUB_ENV

      - name: 📂 Ensure workspace directories exist
        run: mkdir -p secrets

      - name: 🧪 Run Full Test Suite
        run: pnpm test:coverage
        env:
          WORKSPACE_ROOT: ${{ github.workspace }}

      - name: 🧾 Run tests with JSON report
        run: pnpm test:ci
        env:
          WORKSPACE_ROOT: ${{ github.workspace }}

      - name: 📦 Upload test results artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results/results.json

      - name: 📊 Upload Coverage Report
        uses: codecov/codecov-action@v4
        if: always()
        continue-on-error: true
        with:
          fail_ci_if_error: false

      - name: ❌ Cancel workflow on failure
        if: failure()
        run: gh run cancel ${{ github.run_id }}
        env:
          GH_TOKEN: ${{ github.token }}

  # ==========================================================================
  # JOB 3: Build Verification
  # ==========================================================================
  build-verify:
    name: 🧱 Build Verification
    runs-on: self-hosted
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: 📥 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🧱 Run Build
        run: pnpm build

      - name: ❌ Cancel workflow on failure
        if: failure()
        run: gh run cancel ${{ github.run_id }}
        env:
          GH_TOKEN: ${{ github.token }}

  # ==========================================================================
  # JOB 4: Security Scan
  # ==========================================================================
  security:
    name: 🔒 Security Scan
    runs-on: self-hosted
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: 📥 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🔒 Setup Trivy
        uses: aquasecurity/setup-trivy@v0.2.2
        with:
          version: v0.69.1
          cache: true

      - name: 🔒 Run Trivy vulnerability scanner
        run: |
          trivy fs . \
            --scanners vuln \
            --severity CRITICAL,HIGH \
            --exit-code 1 \
            --ignore-unfixed \
            --skip-dirs secrets,.pnpm-store,node_modules \
            --ignorefile .trivyignore \
            --format table

      - name: 🔍 Audit npm dependencies
        run: pnpm audit --audit-level=high

      - name: ❌ Cancel workflow on failure
        if: failure()
        run: gh run cancel ${{ github.run_id }}
        env:
          GH_TOKEN: ${{ github.token }}

  # ===========================================================================
  # JOB 5: Docker Configuration Validation
  # ===========================================================================
  docker-config:
    name: 🐳 Docker Config Validation
    runs-on: self-hosted
    timeout-minutes: 5

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔎 Validate daemon.json syntax
        run: |
          if [ -f "./infra/config/docker/daemon.json" ]; then
            echo "✅ Validating daemon.json syntax..."
            python3 -m json.tool ./infra/config/docker/daemon.json > /dev/null
            echo "✅ daemon.json is valid JSON"
          else
            echo "⏭️ daemon.json not found (optional)"
          fi

      - name: ❌ Cancel workflow on failure
        if: failure()
        run: gh run cancel ${{ github.run_id }}
        env:
          GH_TOKEN: ${{ github.token }}

  # ===========================================================================
  # JOB 6: ShellCheck (infra/scripts/*.sh)
  # ===========================================================================
  shellcheck:
    name: 🐚 ShellCheck
    runs-on: self-hosted
    timeout-minutes: 5

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐚 Run ShellCheck
        run: |
          set -euo pipefail
          if ! ls infra/scripts/*.sh >/dev/null 2>&1; then
            echo "No infra/scripts/*.sh found, skipping"
            exit 0
          fi
          if command -v shellcheck >/dev/null 2>&1; then
            shellcheck -x infra/scripts/*.sh
          else
            FILES=$(cd infra/scripts && ls *.sh | sed 's|^|/mnt/infra/scripts/|')
            docker run --rm --security-opt apparmor=unconfined -v "$PWD:/mnt" koalaman/shellcheck:stable -x $FILES
          fi

      - name: 🔎 Validate docker-compose.yml
        run: |
          if [ -f "./infra/docker/docker-compose.yml" ]; then
            echo "✅ Validating docker-compose.yml..."
            STUB_DIR="$(pwd)/.ci-stub-secrets"
            mkdir -p "${STUB_DIR}"/{api,workers,infra}
            touch "${STUB_DIR}/api/api.env" \
                  "${STUB_DIR}/workers/workers.env" \
                  "${STUB_DIR}/infra/userlist.txt" \
                  "${STUB_DIR}/infra/pgbouncer.ini"
            CERNIQ_RENDERED_SECRETS_DIR="${STUB_DIR}" \
              docker compose -f ./infra/docker/docker-compose.yml config --quiet
            rm -rf "${STUB_DIR}"
            echo "✅ docker-compose.yml is valid"
          else
            echo "⏭️ docker-compose.yml not found (optional)"
          fi

      - name: 🔎 Check shell scripts syntax
        run: |
          echo "✅ Validating shell scripts..."
          for script in ./infra/scripts/*.sh; do
            if [ -f "$script" ]; then
              bash -n "$script" && echo "  ✓ $script"
            fi
          done

      - name: 🔎 Verify network configuration (ADR-0015)
        run: |
          if [ -f "./infra/docker/docker-compose.yml" ]; then
            echo "✅ Checking network configuration..."
            for net in cerniq_public cerniq_backend cerniq_data; do
              if grep -q "$net:" ./infra/docker/docker-compose.yml; then
                echo "  ✓ Network $net defined"
              else
                echo "  ✗ Network $net missing!"
                exit 1
              fi
            done
            for net in cerniq_public cerniq_backend cerniq_data; do
              if grep -A2 "$net:" ./infra/docker/docker-compose.yml | grep -q "external: true"; then
                echo "  ✓ Network $net is external"
              else
                echo "  ⚠️ Network $net should be external: true"
              fi
            done
          fi

      - name: 🔎 Verify port allocation (ADR-0022)
        run: |
          if [ -f "./infra/docker/docker-compose.yml" ]; then
            echo "✅ Checking port allocation compliance..."
            INVALID_PORTS=$(grep -E "^\s+-\s+['\"]?[0-9]+:" ./infra/docker/docker-compose.yml | grep -vE "64[0-9]{3}:" | grep -v "#" || true)
            if [ -n "$INVALID_PORTS" ]; then
              echo "  ⚠️ Found ports outside 64000-64099 range:"
              echo "$INVALID_PORTS"
              echo "  (Review if these are intentional)"
            else
              echo "  ✓ All ports within 64000-64099 range"
            fi
          fi

      - name: ❌ Cancel workflow on failure
        if: failure()
        run: gh run cancel ${{ github.run_id }}
        env:
          GH_TOKEN: ${{ github.token }}

  # ===========================================================================
  # JOB 7: Docker Build Verification
  # ===========================================================================
  docker-build:
    name: 🐳 Docker Build
    runs-on: self-hosted
    timeout-minutes: 20
    needs: [lint, test]

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔎 Check for Dockerfiles
        id: check-dockerfiles
        run: |
          if [ -f "./apps/api/Dockerfile" ] && [ -f "./apps/web/Dockerfile" ] && [ -f "./apps/web-admin/Dockerfile" ] && [ -f "./apps/monitoring-api/Dockerfile" ]; then
            echo "dockerfiles_exist=true" >> $GITHUB_OUTPUT
          else
            echo "dockerfiles_exist=false" >> $GITHUB_OUTPUT
            echo "⏭️ Skipping Docker build - Dockerfiles not yet created"
          fi

      - name: 🐳 Set up Docker Buildx
        if: steps.check-dockerfiles.outputs.dockerfiles_exist == 'true'
        uses: docker/setup-buildx-action@v3

      - name: 🏗️ Build API image
        if: steps.check-dockerfiles.outputs.dockerfiles_exist == 'true'
        uses: docker/build-push-action@v6.19.2
        with:
          context: .
          file: ./apps/api/Dockerfile
          push: false
          tags: cerniq/api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 🏗️ Build Web image
        if: steps.check-dockerfiles.outputs.dockerfiles_exist == 'true'
        uses: docker/build-push-action@v6.19.2
        with:
          context: .
          file: ./apps/web/Dockerfile
          push: false
          tags: cerniq/web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 🏗️ Build Web Admin image
        if: steps.check-dockerfiles.outputs.dockerfiles_exist == 'true'
        uses: docker/build-push-action@v6.19.2
        with:
          context: .
          file: ./apps/web-admin/Dockerfile
          push: false
          tags: cerniq/web-admin:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 🏗️ Build Monitoring API image
        if: steps.check-dockerfiles.outputs.dockerfiles_exist == 'true'
        uses: docker/build-push-action@v6.19.2
        with:
          context: .
          file: ./apps/monitoring-api/Dockerfile
          push: false
          tags: cerniq/monitoring-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: ❌ Cancel workflow on failure
        if: failure()
        run: gh run cancel ${{ github.run_id }}
        env:
          GH_TOKEN: ${{ github.token }}

  # ==========================================================================
  # JOB 8: Detect changes for conditional jobs
  # ==========================================================================
  changes:
    name: 🧭 Detect Changes
    runs-on: self-hosted
    outputs:
      workers: ${{ steps.filter.outputs.workers }}

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔎 Paths filter
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            workers:
              - 'workers/**'

  # ==========================================================================
  # JOB 9: Python Workers Lint (conditional — only when workers/ changed)
  # ==========================================================================
  python-lint:
    name: 🐍 Python Lint
    runs-on: self-hosted
    timeout-minutes: 10
    needs: changes
    if: needs.changes.outputs.workers == 'true'

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 📦 Install Python dependencies
        run: pip install ruff mypy

      - name: 🔍 Run Ruff linter
        run: ruff check workers/

      - name: 📝 Run mypy type check
        run: mypy workers/ --ignore-missing-imports
        continue-on-error: true

      - name: ❌ Cancel workflow on failure
        if: failure()
        run: gh run cancel ${{ github.run_id }}
        env:
          GH_TOKEN: ${{ github.token }}

  # ===========================================================================
  # Final Status Check (for branch protection)
  # ===========================================================================
  ci-status:
    name: ✅ CI Status
    runs-on: self-hosted
    needs:
      [lint, test, build-verify, security, docker-config, docker-build, shellcheck, python-lint]
    if: always()

    steps:
      - name: Check CI Status
        run: |
          echo "📊 Job results:"
          echo "  lint:         ${{ needs.lint.result }}"
          echo "  test:         ${{ needs.test.result }}"
          echo "  build-verify: ${{ needs.build-verify.result }}"
          echo "  security:     ${{ needs.security.result }}"
          echo "  docker-config:${{ needs.docker-config.result }}"
          echo "  docker-build: ${{ needs.docker-build.result }}"
          echo "  shellcheck:   ${{ needs.shellcheck.result }}"
          echo "  python-lint:  ${{ needs.python-lint.result }}"

          FAILED=0
          for job in lint test build-verify security docker-config docker-build shellcheck; do
            result=""
            case "$job" in
              lint)          result="${{ needs.lint.result }}" ;;
              test)          result="${{ needs.test.result }}" ;;
              build-verify)  result="${{ needs.build-verify.result }}" ;;
              security)      result="${{ needs.security.result }}" ;;
              docker-config) result="${{ needs.docker-config.result }}" ;;
              docker-build)  result="${{ needs.docker-build.result }}" ;;
              shellcheck)    result="${{ needs.shellcheck.result }}" ;;
            esac
            if [[ "$result" != "success" ]]; then
              echo "❌ Job '$job' did not succeed (result: $result)"
              FAILED=1
            fi
          done

          # python-lint is conditional (only runs when workers/ changed) — skipped is acceptable
          if [[ "${{ needs.python-lint.result }}" == "failure" ]] || \
             [[ "${{ needs.python-lint.result }}" == "cancelled" ]]; then
            echo "❌ Job 'python-lint' failed (result: ${{ needs.python-lint.result }})"
            FAILED=1
          fi

          if [[ "$FAILED" -eq 1 ]]; then
            echo "❌ CI failed — CD will NOT be triggered"
            exit 1
          fi

          echo "✅ All CI checks passed"

  # ===========================================================================
  # Trigger CD Pipeline (only on push, after all CI checks pass)
  # ===========================================================================
  trigger-cd:
    name: 🚀 Trigger CD
    runs-on: self-hosted
    needs: ci-status
    if: >-
      github.event_name == 'push' &&
      needs.ci-status.result == 'success'

    steps:
      - name: 🚀 Trigger CD Pipeline
        run: |
          BRANCH="${{ github.ref_name }}"
          SHA="${{ github.sha }}"
          SHORT_SHA="${SHA:0:7}"

          if [[ "$BRANCH" == "main" ]]; then
            ENVIRONMENT="production"
            LATEST_TAG=$(gh api repos/${{ github.repository }}/tags --jq '.[].name' 2>/dev/null | grep '^v0\.0\.' | sort -V | tail -1)
            if [[ -z "$LATEST_TAG" ]]; then
              VERSION="v0.0.1"
            else
              PATCH=$(echo "$LATEST_TAG" | sed 's/v0\.0\.//')
              VERSION="v0.0.$((PATCH + 1))"
            fi
          else
            ENVIRONMENT="staging"
            SAFE_BRANCH=$(echo "$BRANCH" | sed 's/[^a-zA-Z0-9]/-/g' | cut -c1-20)
            VERSION="${SAFE_BRANCH}-${SHORT_SHA}"
          fi

          echo "🎯 Triggering CD: environment=$ENVIRONMENT version=$VERSION"
          gh workflow run deploy.yml \
            --ref "${{ github.ref }}" \
            -f environment="$ENVIRONMENT" \
            -f version="$VERSION"
        env:
          GH_TOKEN: ${{ github.token }}
