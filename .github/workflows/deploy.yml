# =============================================================================
# CERNIQ.APP — CD Pipeline for Deployments (Refactored v2.0)
# =============================================================================
# Workflow: deploy.yml
# Trigger:
#   - Push to any branch except main → Staging
#   - Push to main → Production
#   - Manual dispatch
#
# Features:
#   - Full configuration sync with correct server paths
#   - Automated OpenBao initialization and setup
#   - Automated firewall configuration
#   - AppRole credentials generation
#   - Initial secrets population
#   - Health verification
#
# Server structure:
#   /opt/cerniq/
#   ├── docker-compose.yml
#   ├── docker-compose.prod.yml  (production only)
#   ├── config/
#   │   ├── postgres/
#   │   └── openbao/
#   ├── scripts/
#   └── secrets/
#
# Reference: ADR-0107 CI/CD Pipeline Strategy
# Created: 2026-02-01
# Updated: 2026-02-05 - Complete refactor for automated deployments
# =============================================================================

name: CD Pipeline

on:
  # CD is triggered exclusively by:
  #   1. CI Pipeline (via trigger-cd job after all checks pass)
  #   2. Manual dispatch (for hotfixes / re-deployments)
  # CD NEVER triggers on push directly — CI must pass first.
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options:
          - staging
          - production
      version:
        description: "Version to deploy (e.g., v1.0.0)"
        required: true
        type: string
      rollback:
        description: "Rollback to previous version (manual only)"
        required: false
        type: boolean
        default: false

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  actions: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/cerniq

jobs:
  # ===========================================================================
  # JOB 1: Determine Environment and Version
  # ===========================================================================
  setup:
    name: 🔧 Setup Deployment
    runs-on: self-hosted
    outputs:
      environment: ${{ steps.determine.outputs.environment }}
      version: ${{ steps.determine.outputs.version }}
      sha: ${{ steps.determine.outputs.sha }}
      should_tag: ${{ steps.determine.outputs.should_tag }}

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🔧 Determine deployment parameters
        id: determine
        run: |
          # CD is always triggered via workflow_dispatch (by CI or manually)
          echo "environment=${{ inputs.environment }}" >> $GITHUB_OUTPUT
          echo "version=${{ inputs.version }}" >> $GITHUB_OUTPUT
          echo "sha=${{ github.sha }}" >> $GITHUB_OUTPUT

          if [[ "${{ inputs.environment }}" == "production" ]]; then
            echo "should_tag=true" >> $GITHUB_OUTPUT
          else
            echo "should_tag=false" >> $GITHUB_OUTPUT
          fi

      - name: 🏷️ Create Git Tag (Production Auto-Version)
        if: steps.determine.outputs.should_tag == 'true'
        run: |
          VERSION="${{ steps.determine.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" -m "Release $VERSION (auto-generated)"
          git push origin "$VERSION"
          echo "✅ Created tag: $VERSION"

      - name: 📋 Display deployment info
        run: |
          echo "🎯 Environment: ${{ steps.determine.outputs.environment }}"
          echo "🏷️ Version: ${{ steps.determine.outputs.version }}"
          echo "📝 SHA: ${{ steps.determine.outputs.sha }}"

  # ===========================================================================
  # JOB 2: Build and Push Docker Images
  # ===========================================================================
  build-push:
    name: 🐳 Build & Push Images
    runs-on: self-hosted
    needs: setup
    if: inputs.rollback != true

    strategy:
      fail-fast: true
      matrix:
        app:
          - name: api
            dockerfile: ./apps/api/Dockerfile
          - name: web
            dockerfile: ./apps/web/Dockerfile
          - name: web-admin
            dockerfile: ./apps/web-admin/Dockerfile
          - name: monitoring-api
            dockerfile: ./apps/monitoring-api/Dockerfile
          - name: worker-enrichment
            dockerfile: ./workers/enrichment/Dockerfile
          - name: worker-outreach
            dockerfile: ./workers/outreach/Dockerfile
          - name: worker-ai
            dockerfile: ./workers/ai/Dockerfile

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.setup.outputs.sha }}

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔐 Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 📋 Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.app.name }}
          tags: |
            type=raw,value=${{ needs.setup.outputs.version }}
            type=sha,prefix=sha-

      - name: 🏗️ Build and push
        uses: docker/build-push-action@v6.19.2
        with:
          context: .
          file: ${{ matrix.app.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ needs.setup.outputs.version }}
            BUILD_SHA=${{ needs.setup.outputs.sha }}

      - name: 🔒 Setup Trivy
        uses: aquasecurity/setup-trivy@v0.2.2
        with:
          version: v0.69.1
          cache: true

      - name: 🔒 Scan image for vulnerabilities
        run: |
          trivy image \
            "${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.app.name }}:${{ needs.setup.outputs.version }}" \
            --scanners vuln \
            --severity CRITICAL,HIGH \
            --exit-code 1 \
            --ignore-unfixed \
            --format table

      - name: ❌ Cancel workflow on failure
        if: failure()
        run: gh run cancel ${{ github.run_id }}
        env:
          GH_TOKEN: ${{ github.token }}

  # ===========================================================================
  # JOB 3: Deploy to Staging
  # ===========================================================================
  deploy-staging:
    name: 🚀 Deploy to Staging
    runs-on: self-hosted
    needs: [setup, build-push]
    if: needs.setup.outputs.environment == 'staging'
    environment:
      name: staging
      url: https://staging.cerniq.app

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.setup.outputs.sha }}

      - name: 🔧 Setup SSH
        run: |
          mkdir -p ~/.ssh
          # Restricted deploy key (deploy user only; old key remains break-glass)
          echo "${{ secrets.STAGING_SSH_KEY_RESTRICTED }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.STAGING_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: 🧰 Ensure jq on staging host
        run: |
          ssh -i ~/.ssh/deploy_key deploy@${{ secrets.STAGING_HOST }} << 'ENDSSH'
            if ! command -v jq >/dev/null 2>&1; then
              if sudo -n true >/dev/null 2>&1; then
                sudo apt-get update
                sudo apt-get install -y jq
              else
                echo "❌ jq missing and sudo not available for deploy user"
                exit 1
              fi
            fi
          ENDSSH

      # =========================================================================
      # STEP 1: Sync ALL configuration files with correct structure
      # =========================================================================
      - name: 📦 Sync ALL configuration files
        run: |
          SSH_CMD="ssh -i ~/.ssh/deploy_key deploy@${{ secrets.STAGING_HOST }}"
          SCP_CMD="scp -i ~/.ssh/deploy_key"
          HOST="deploy@${{ secrets.STAGING_HOST }}"

          echo "📁 Creating COMPLETE server directory structure..."
          $SSH_CMD << 'ENDSSH'
            mkdir -p /opt/cerniq/{config/{openbao/{policies,templates},fail2ban,cron,logrotate,docker},scripts,secrets,backups}
          ENDSSH

          echo "📄 Syncing docker-compose files..."
          $SCP_CMD infra/docker/docker-compose.yml ${HOST}:/opt/cerniq/
          $SCP_CMD infra/docker/docker-compose.prod.yml ${HOST}:/opt/cerniq/
          # Vector/OTEL configs removed — observability is centralized on orchestrator

          echo "📄 Syncing OpenBao config (CORRECT PATH)..."
          $SCP_CMD infra/config/openbao/*.hcl ${HOST}:/opt/cerniq/config/openbao/
          $SCP_CMD infra/config/openbao/policies/*.hcl ${HOST}:/opt/cerniq/config/openbao/policies/
          $SCP_CMD infra/config/openbao/templates/*.tpl ${HOST}:/opt/cerniq/config/openbao/templates/

          echo "📄 Syncing security configs (fail2ban, cron, logrotate)..."
          $SCP_CMD infra/config/fail2ban/jail.local ${HOST}:/opt/cerniq/config/fail2ban/
          $SCP_CMD infra/config/cron/cerniq-backup ${HOST}:/opt/cerniq/config/cron/
          $SCP_CMD infra/config/logrotate/cerniq-backup ${HOST}:/opt/cerniq/config/logrotate/
          $SCP_CMD infra/config/docker/daemon.json ${HOST}:/opt/cerniq/config/docker/ 2>/dev/null || true

          echo "📄 Syncing ALL scripts..."
          $SCP_CMD infra/scripts/*.sh ${HOST}:/opt/cerniq/scripts/
          $SSH_CMD "chmod +x /opt/cerniq/scripts/*.sh"

          echo "✅ COMPLETE configuration sync done"

      - name: 🔁 Sync orchestrator Traefik route
        run: |
          KEY_PATH="${HOME}/.ssh/id_ed25519_production"
          if [[ ! -f "${KEY_PATH}" ]]; then
            echo "Orchestrator SSH key not found at ${KEY_PATH}, skipping orchestrator sync"
            exit 0
          fi
          mkdir -p ~/.ssh
          ORCH_HOST="77.42.76.185"
          ORCH_USER="root"
          ssh-keyscan -H "$ORCH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          ssh -i "${KEY_PATH}" -o IdentitiesOnly=yes "${ORCH_USER}@${ORCH_HOST}" "mkdir -p /opt/traefik/dynamic"
          scp -i "${KEY_PATH}" -o IdentitiesOnly=yes infra/config/traefik-orchestrator/cerniq.yml "${ORCH_USER}@${ORCH_HOST}:/opt/traefik/dynamic/cerniq.yml"
          echo "✅ Traefik file provider will auto-reload (no restart needed)"

      # =========================================================================
      # STEP 2: Save current version for rollback
      # =========================================================================
      - name: 💾 Save current version for rollback
        continue-on-error: true
        run: |
          ssh -i ~/.ssh/deploy_key deploy@${{ secrets.STAGING_HOST }} << 'ENDSSH'
            cd /opt/cerniq
            
            # Prefer a dedicated marker file; docker ps parsing is unreliable when
            # the app stack is not deployed yet (infra-only deployments).
            if [ -f /opt/cerniq/.current_deploy ]; then
              cp -f /opt/cerniq/.current_deploy /opt/cerniq/.previous_deploy
              echo "💾 Saved previous version: $(cat /opt/cerniq/.previous_deploy 2>/dev/null || echo 'none')"
            else
              echo "ℹ️ No /opt/cerniq/.current_deploy found (first deployment)"
            fi
          ENDSSH

      # =========================================================================
      # STEP 3: Deploy Docker services
      # =========================================================================
      - name: 🚀 Deploy Docker services
        run: |
          ssh -i ~/.ssh/deploy_key deploy@${{ secrets.STAGING_HOST }} << 'ENDSSH'
            cd /opt/cerniq
            
            # Ensure Docker networks exist
            docker network create --driver bridge --subnet=172.29.10.0/24 cerniq_public 2>/dev/null || true
            docker network create --driver bridge --subnet=172.29.20.0/24 cerniq_backend 2>/dev/null || true
            docker network create --driver bridge --subnet=172.29.30.0/24 cerniq_data 2>/dev/null || true
            
            # Pull and deploy with production overlay
            echo "🐳 Pulling images..."
            docker compose -f docker-compose.yml -f docker-compose.prod.yml pull || true
            
            echo "🚀 Starting services..."
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --force-recreate --remove-orphans
            
            echo "⏳ Waiting for services to start..."
            sleep 15
            
            # Verify core services
            echo "📊 Service status:"
            docker ps --format 'table {{.Names}}\t{{.Status}}' | grep cerniq || true

            # Persist deployed version marker for safe future rollbacks.
            echo '${{ needs.setup.outputs.version }}' > /opt/cerniq/.current_deploy
          ENDSSH

      # =========================================================================
      # STEP 4: Initialize OpenBao (if needed)
      # =========================================================================
      - name: 🔐 Initialize OpenBao
        run: |
          ssh -i ~/.ssh/deploy_key deploy@${{ secrets.STAGING_HOST }} << 'ENDSSH'
            cd /opt/cerniq
            echo "✅ Skipped: OpenBao server is external on orchestrator (s3cr3ts.neanelu.ro)"
          ENDSSH

      # =========================================================================
      # STEP 6: Start OpenBao agents
      # =========================================================================
      - name: 🤖 Start OpenBao Agents
        run: |
          ssh -i ~/.ssh/deploy_key deploy@${{ secrets.STAGING_HOST }} << 'ENDSSH'
            cd /opt/cerniq
            
            # Runtime secrets directory (render target for templates).
            mkdir -p /opt/cerniq/runtime-secrets/{api,workers,infra}
            chmod 700 /opt/cerniq/runtime-secrets /opt/cerniq/runtime-secrets/* || true
            
            # Check prerequisites
            if [ ! -f /opt/cerniq/secrets/api_role_id ]; then
              echo "⚠️ AppRole credentials not found, skipping agents"
              exit 0
            fi
            
            echo "🤖 Starting OpenBao agents..."
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d openbao-agent-api openbao-agent-workers openbao-agent-infra
            
            echo "⏳ Waiting for agents to render secrets..."
            sleep 10
            
            # Verify secrets rendered
            if docker exec cerniq-openbao-agent-api test -f /secrets/api.env 2>/dev/null; then
              echo "✅ API secrets rendered successfully"
            else
              echo "⚠️ API secrets not yet rendered"
              docker logs cerniq-openbao-agent-api --tail 10 2>&1 || true
            fi
          ENDSSH

      # =========================================================================
      # STEP 7: Configure firewall
      # =========================================================================
      - name: 🔥 Configure Firewall
        continue-on-error: true
        run: |
          ssh -i ~/.ssh/deploy_key deploy@${{ secrets.STAGING_HOST }} << 'ENDSSH'
            cd /opt/cerniq
            
            # Check if UFW is active
            if sudo -n ufw status 2>/dev/null | grep -q "Status: active"; then
              echo "✅ UFW already active"
            else
              echo "🔥 Configuring firewall..."
              if [ -f /opt/cerniq/scripts/setup-firewall.sh ]; then
                sudo -n /opt/cerniq/scripts/setup-firewall.sh || echo "⚠️ Firewall setup skipped/failed (no sudo)"
              else
                echo "⚠️ No setup-firewall.sh; skipping (requires sudo)"
              fi
            fi
            
            sudo -n ufw status verbose 2>/dev/null | head -10 || true
          ENDSSH

      # =========================================================================
      # STEP 8: Install system configurations (fail2ban, cron)
      # =========================================================================
      - name: 🔧 Install system configurations
        continue-on-error: true
        run: |
          ssh -i ~/.ssh/deploy_key deploy@${{ secrets.STAGING_HOST }} << 'ENDSSH'
            cd /opt/cerniq
            
            echo "📋 Installing fail2ban configuration..."
            if [ -f /opt/cerniq/config/fail2ban/jail.local ]; then
              sudo -n cp /opt/cerniq/config/fail2ban/jail.local /etc/fail2ban/jail.local 2>/dev/null || true
              sudo -n systemctl enable fail2ban 2>/dev/null || true
              sudo -n systemctl restart fail2ban 2>/dev/null || true
              echo "✅ fail2ban configured"
            fi
            
            echo "📋 Installing backup cron job..."
            if [ -f /opt/cerniq/config/cron/cerniq-backup ]; then
              sudo -n cp /opt/cerniq/config/cron/cerniq-backup /etc/cron.d/cerniq-backup 2>/dev/null || true
              sudo -n chmod 644 /etc/cron.d/cerniq-backup 2>/dev/null || true
              sudo -n systemctl reload cron 2>/dev/null || true
              echo "✅ Backup cron installed"
            fi
            
            echo "📋 Installing logrotate configuration..."
            if [ -f /opt/cerniq/config/logrotate/cerniq-backup ]; then
              sudo -n cp /opt/cerniq/config/logrotate/cerniq-backup /etc/logrotate.d/cerniq-backup 2>/dev/null || true
              echo "✅ Logrotate configured"
            fi
          ENDSSH

      # =========================================================================
      # STEP 9: Health Check and verification (SMOKE TESTS)
      # =========================================================================
      - name: 🧪 Verify Staging Deployment (Smoke Tests)
        run: |
          ssh -i ~/.ssh/deploy_key deploy@${{ secrets.STAGING_HOST }} << 'ENDSSH'
            echo "========================================"
            echo "  STAGING DEPLOYMENT SMOKE TESTS"
            echo "========================================"
            
            cd /opt/cerniq
            FAILED=0
            
            echo ""
            echo "📊 Container Status"
            docker ps --format 'table {{.Names}}\t{{.Status}}' | grep cerniq | sort
            
            echo ""
            echo "🔍 Core Services Health Checks"
            
            # External PostgreSQL reachability (CT107)
            echo -n "  PostgreSQL: "
            if docker run --rm --network host postgres:18 pg_isready -h 10.0.1.107 -p 5432 >/dev/null 2>&1; then
              echo "✅ HEALTHY"
            else
              echo "❌ FAILED"
              FAILED=1
            fi
            
            # PgBouncer + OpenBao dynamic creds (end-to-end)
            echo -n "  PgBouncer:  "
            if docker run --rm --network cerniq_backend \
              --env-file /opt/cerniq/runtime-secrets/api/api.env \
              postgres:18 sh -c 'psql "$DATABASE_URL" -Atqc "SELECT 1"' >/dev/null 2>&1; then
              echo "✅ HEALTHY"
            else
              echo "⚠️ NOT READY (may be initializing)"
            fi
            
            # Redis health
            echo -n "  Redis:      "
            if docker run --rm --network host \
              --env-file /opt/cerniq/runtime-secrets/api/api.env \
              redis:8-alpine sh -c 'redis-cli -u "$REDIS_URL" PING' 2>/dev/null | grep -q PONG; then
              echo "✅ HEALTHY"
            else
              echo "❌ FAILED"
              FAILED=1
            fi
            
            # Ingress health via orchestrator Traefik
            # NOTE: Non-blocking until app containers (web/api/admin) are added to
            # docker-compose. Full ingress validated separately (f2-10).
            echo -n "  Ingress:    "
            if curl -skf https://staging.cerniq.app >/dev/null 2>&1; then
              echo "✅ HEALTHY"
            else
              echo "⚠️ NOT READY (app containers not deployed yet — ingress validated in f2-10)"
            fi
            
            # OpenBao agents health (remote OpenBao on orchestrator)
            echo -n "  OpenBao:    "
            if docker inspect -f '{{.State.Health.Status}}' cerniq-openbao-agent-api 2>/dev/null | grep -q healthy && \
               docker inspect -f '{{.State.Health.Status}}' cerniq-openbao-agent-workers 2>/dev/null | grep -q healthy && \
               docker inspect -f '{{.State.Health.Status}}' cerniq-openbao-agent-infra 2>/dev/null | grep -q healthy; then
              echo "✅ HEALTHY (agents)"
            else
              echo "❌ FAILED (agents)"
              FAILED=1
            fi
            
            echo ""
            echo "🔐 Security Services"
            
            # fail2ban
            echo -n "  fail2ban:   "
            if sudo -n systemctl is-active fail2ban >/dev/null 2>&1; then
              echo "✅ ACTIVE"
            else
              echo "⚠️ INACTIVE (or no sudo)"
            fi
            
            # UFW
            echo -n "  UFW:        "
            if sudo -n ufw status 2>/dev/null | grep -q "Status: active"; then
              echo "✅ ACTIVE"
            else
              echo "⚠️ INACTIVE (or no sudo)"
            fi
            
            echo ""
            echo "========================================"
            if [ $FAILED -eq 0 ]; then
              echo "✅ ALL SMOKE TESTS PASSED"
              echo "Staging deployment complete - version ${{ needs.setup.outputs.version }}"
            else
              echo "❌ SOME SMOKE TESTS FAILED"
              echo "Review the failures above and check container logs"
              exit 1
            fi
            echo "========================================"
          ENDSSH

  # ===========================================================================
  # JOB 4: Deploy to Production
  # ===========================================================================
  deploy-production:
    name: 🚀 Deploy to Production
    runs-on: self-hosted
    needs: [setup, build-push]
    if: needs.setup.outputs.environment == 'production'
    environment:
      name: production
      url: https://cerniq.app

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.setup.outputs.sha }}

      - name: 🔧 Setup SSH
        run: |
          mkdir -p ~/.ssh
          # Restricted deploy key (deploy user only; old key remains break-glass)
          echo "${{ secrets.PRODUCTION_SSH_KEY_RESTRICTED }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.PRODUCTION_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: 🧰 Ensure jq on production host
        run: |
          ssh -i ~/.ssh/deploy_key deploy@${{ secrets.PRODUCTION_HOST }} << 'ENDSSH'
            if ! command -v jq >/dev/null 2>&1; then
              if sudo -n true >/dev/null 2>&1; then
                sudo apt-get update
                sudo apt-get install -y jq
              else
                echo "❌ jq missing and sudo not available for deploy user"
                exit 1
              fi
            fi
          ENDSSH

      - name: 🔄 Create database backup
        continue-on-error: true
        run: |
          ssh -i ~/.ssh/deploy_key deploy@${{ secrets.PRODUCTION_HOST }} << 'ENDSSH'
            if [ -f /opt/cerniq/scripts/backup-pre-deploy.sh ]; then
              /opt/cerniq/scripts/backup-pre-deploy.sh
            fi
          ENDSSH

      # =========================================================================
      # STEP 1: Sync ALL configuration files
      # =========================================================================
      - name: 📦 Sync ALL configuration files
        run: |
          SSH_CMD="ssh -i ~/.ssh/deploy_key deploy@${{ secrets.PRODUCTION_HOST }}"
          SCP_CMD="scp -i ~/.ssh/deploy_key"
          HOST="deploy@${{ secrets.PRODUCTION_HOST }}"

          echo "📁 Creating COMPLETE server directory structure..."
          $SSH_CMD << 'ENDSSH'
            mkdir -p /opt/cerniq/{config/{openbao/{policies,templates},fail2ban,cron,logrotate,docker},scripts,secrets,backups}
          ENDSSH

          echo "📄 Syncing docker-compose files..."
          $SCP_CMD infra/docker/docker-compose.yml ${HOST}:/opt/cerniq/
          $SCP_CMD infra/docker/docker-compose.prod.yml ${HOST}:/opt/cerniq/
          # Vector/OTEL configs removed — observability is centralized on orchestrator

          echo "📄 Syncing OpenBao config (CORRECT PATH)..."
          $SCP_CMD infra/config/openbao/*.hcl ${HOST}:/opt/cerniq/config/openbao/
          $SCP_CMD infra/config/openbao/policies/*.hcl ${HOST}:/opt/cerniq/config/openbao/policies/
          $SCP_CMD infra/config/openbao/templates/*.tpl ${HOST}:/opt/cerniq/config/openbao/templates/

          echo "📄 Syncing security configs (fail2ban, cron, logrotate)..."
          $SCP_CMD infra/config/fail2ban/jail.local ${HOST}:/opt/cerniq/config/fail2ban/
          $SCP_CMD infra/config/cron/cerniq-backup ${HOST}:/opt/cerniq/config/cron/
          $SCP_CMD infra/config/logrotate/cerniq-backup ${HOST}:/opt/cerniq/config/logrotate/
          $SCP_CMD infra/config/docker/daemon.json ${HOST}:/opt/cerniq/config/docker/ 2>/dev/null || true

          echo "📄 Syncing ALL scripts..."
          $SCP_CMD infra/scripts/*.sh ${HOST}:/opt/cerniq/scripts/
          $SSH_CMD "chmod +x /opt/cerniq/scripts/*.sh"

          echo "✅ COMPLETE configuration sync done"

      - name: 🔁 Sync orchestrator Traefik route
        run: |
          KEY_PATH="${HOME}/.ssh/id_ed25519_production"
          if [[ ! -f "${KEY_PATH}" ]]; then
            echo "Orchestrator SSH key not found at ${KEY_PATH}, skipping orchestrator sync"
            exit 0
          fi
          mkdir -p ~/.ssh
          ORCH_HOST="77.42.76.185"
          ORCH_USER="root"
          ssh-keyscan -H "$ORCH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          ssh -i "${KEY_PATH}" -o IdentitiesOnly=yes "${ORCH_USER}@${ORCH_HOST}" "mkdir -p /opt/traefik/dynamic"
          scp -i "${KEY_PATH}" -o IdentitiesOnly=yes infra/config/traefik-orchestrator/cerniq.yml "${ORCH_USER}@${ORCH_HOST}:/opt/traefik/dynamic/cerniq.yml"
          echo "✅ Traefik file provider will auto-reload (no restart needed)"

      # =========================================================================
      # STEP 2: Save current version for rollback
      # =========================================================================
      - name: 💾 Save current version for rollback
        continue-on-error: true
        run: |
          ssh -i ~/.ssh/deploy_key deploy@${{ secrets.PRODUCTION_HOST }} << 'ENDSSH'
            cd /opt/cerniq
            
            if [ -f /opt/cerniq/.current_deploy ]; then
              cp -f /opt/cerniq/.current_deploy /opt/cerniq/.previous_deploy
              echo "💾 Saved previous version: $(cat /opt/cerniq/.previous_deploy 2>/dev/null || echo 'none')"
            else
              echo "ℹ️ No /opt/cerniq/.current_deploy found (first deployment)"
            fi
          ENDSSH

      # =========================================================================
      # STEP 3: Deploy Docker services
      # =========================================================================
      - name: 🚀 Deploy Docker services
        run: |
          ssh -i ~/.ssh/deploy_key deploy@${{ secrets.PRODUCTION_HOST }} << 'ENDSSH'
            cd /opt/cerniq
            
            # Ensure Docker networks exist
            docker network create --driver bridge --subnet=172.29.10.0/24 cerniq_public 2>/dev/null || true
            docker network create --driver bridge --subnet=172.29.20.0/24 cerniq_backend 2>/dev/null || true
            docker network create --driver bridge --subnet=172.29.30.0/24 cerniq_data 2>/dev/null || true
            
            # Deploy with production overlay
            echo "🐳 Pulling images..."
            docker compose -f docker-compose.yml -f docker-compose.prod.yml pull || true
            
            echo "🚀 Starting services..."
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --remove-orphans
            
            echo "⏳ Waiting for services to start..."
            sleep 20
            
            echo "📊 Service status:"
            docker ps --format 'table {{.Names}}\t{{.Status}}' | grep cerniq || true

            # Persist deployed version marker for safe future rollbacks.
            echo '${{ needs.setup.outputs.version }}' > /opt/cerniq/.current_deploy
          ENDSSH

      # =========================================================================
      # STEP 4: Initialize OpenBao (if needed) - NO AUTO-UNSEAL IN PRODUCTION
      # =========================================================================
      - name: 🔐 Initialize OpenBao (Production)
        run: |
          ssh -i ~/.ssh/deploy_key deploy@${{ secrets.PRODUCTION_HOST }} << 'ENDSSH'
            cd /opt/cerniq
            echo "✅ Skipped: OpenBao server is external on orchestrator (s3cr3ts.neanelu.ro)"
          ENDSSH

      # =========================================================================
      # STEP 6: Start agents (external OpenBao, if configured)
      # =========================================================================
      - name: 🤖 Start OpenBao Agents
        continue-on-error: true
        run: |
          ssh -i ~/.ssh/deploy_key deploy@${{ secrets.PRODUCTION_HOST }} << 'ENDSSH'
            cd /opt/cerniq
            
            # Runtime secrets directory (render target for templates).
            mkdir -p /opt/cerniq/runtime-secrets/{api,workers,infra}
            chmod 700 /opt/cerniq/runtime-secrets /opt/cerniq/runtime-secrets/* || true
            
            if [ ! -f /opt/cerniq/secrets/api_role_id ]; then
              echo "⚠️ AppRole credentials not found, skipping agents"
              exit 0
            fi
            
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d openbao-agent-api openbao-agent-workers openbao-agent-infra
            
            sleep 10
            
            if docker exec cerniq-openbao-agent-api test -f /secrets/api.env 2>/dev/null; then
              echo "✅ API secrets rendered"
            else
              echo "⚠️ API secrets not rendered yet"
            fi
          ENDSSH

      # =========================================================================
      # STEP 7: Configure firewall
      # =========================================================================
      - name: 🔥 Configure Firewall
        continue-on-error: true
        run: |
          ssh -i ~/.ssh/deploy_key deploy@${{ secrets.PRODUCTION_HOST }} << 'ENDSSH'
            cd /opt/cerniq
            
            if sudo -n ufw status 2>/dev/null | grep -q "Status: active"; then
              echo "✅ UFW already active"
            else
              echo "🔥 Configuring production firewall..."
              if [ -f /opt/cerniq/scripts/setup-firewall.sh ]; then
                sudo -n CERNIQ_UFW_AUTO_APPROVE=true /opt/cerniq/scripts/setup-firewall.sh || true
              else
                echo "⚠️ No setup-firewall.sh; skipping (requires sudo)"
              fi
            fi
            
            sudo -n ufw status verbose 2>/dev/null | head -10 || true
          ENDSSH

      # =========================================================================
      # STEP 8: Install system configurations (fail2ban, cron)
      # =========================================================================
      - name: 🔧 Install system configurations
        continue-on-error: true
        run: |
          ssh -i ~/.ssh/deploy_key deploy@${{ secrets.PRODUCTION_HOST }} << 'ENDSSH'
            cd /opt/cerniq
            
            echo "📋 Installing fail2ban configuration..."
            if [ -f /opt/cerniq/config/fail2ban/jail.local ]; then
              sudo -n cp /opt/cerniq/config/fail2ban/jail.local /etc/fail2ban/jail.local 2>/dev/null || true
              sudo -n systemctl enable fail2ban 2>/dev/null || true
              sudo -n systemctl restart fail2ban 2>/dev/null || true
              echo "✅ fail2ban configured"
            fi
            
            echo "📋 Installing backup cron job..."
            if [ -f /opt/cerniq/config/cron/cerniq-backup ]; then
              sudo -n cp /opt/cerniq/config/cron/cerniq-backup /etc/cron.d/cerniq-backup 2>/dev/null || true
              sudo -n chmod 644 /etc/cron.d/cerniq-backup 2>/dev/null || true
              sudo -n systemctl reload cron 2>/dev/null || true
              echo "✅ Backup cron installed"
            fi
            
            echo "📋 Installing logrotate configuration..."
            if [ -f /opt/cerniq/config/logrotate/cerniq-backup ]; then
              sudo -n cp /opt/cerniq/config/logrotate/cerniq-backup /etc/logrotate.d/cerniq-backup 2>/dev/null || true
              echo "✅ Logrotate configured"
            fi
          ENDSSH

      # =========================================================================
      # STEP 9: Health Check and verification (SMOKE TESTS)
      # =========================================================================
      - name: 🧪 Verify Production Deployment (Smoke Tests)
        run: |
          ssh -i ~/.ssh/deploy_key deploy@${{ secrets.PRODUCTION_HOST }} << 'ENDSSH'
            echo "========================================"
            echo "  PRODUCTION DEPLOYMENT SMOKE TESTS"
            echo "========================================"
            
            cd /opt/cerniq
            FAILED=0
            
            echo ""
            echo "📊 Container Status"
            docker ps --format 'table {{.Names}}\t{{.Status}}' | grep cerniq | sort
            
            echo ""
            echo "🔍 Core Services Health Checks"
            
            # External PostgreSQL reachability (CT107)
            echo -n "  PostgreSQL: "
            if docker run --rm --network host postgres:18 pg_isready -h 10.0.1.107 -p 5432 >/dev/null 2>&1; then
              echo "✅ HEALTHY"
            else
              echo "❌ FAILED"
              FAILED=1
            fi
            
            # PgBouncer + OpenBao dynamic creds (end-to-end)
            echo -n "  PgBouncer:  "
            if docker run --rm --network cerniq_backend \
              --env-file /opt/cerniq/runtime-secrets/api/api.env \
              postgres:18 sh -c 'psql "$DATABASE_URL" -Atqc "SELECT 1"' >/dev/null 2>&1; then
              echo "✅ HEALTHY"
            else
              echo "⚠️ NOT READY (may be initializing)"
            fi
            
            # Redis health
            echo -n "  Redis:      "
            if docker run --rm --network host \
              --env-file /opt/cerniq/runtime-secrets/api/api.env \
              redis:8-alpine sh -c 'redis-cli -u "$REDIS_URL" PING' 2>/dev/null | grep -q PONG; then
              echo "✅ HEALTHY"
            else
              echo "❌ FAILED"
              FAILED=1
            fi
            
            # Ingress health via orchestrator Traefik
            echo -n "  Ingress:    "
            if curl -skf https://cerniq.app >/dev/null 2>&1; then
              echo "✅ HEALTHY"
            else
              echo "❌ FAILED"
              FAILED=1
            fi
            
            # OpenBao agents health (remote OpenBao on orchestrator)
            echo -n "  OpenBao:    "
            if docker inspect -f '{{.State.Health.Status}}' cerniq-openbao-agent-api 2>/dev/null | grep -q healthy && \
               docker inspect -f '{{.State.Health.Status}}' cerniq-openbao-agent-workers 2>/dev/null | grep -q healthy && \
               docker inspect -f '{{.State.Health.Status}}' cerniq-openbao-agent-infra 2>/dev/null | grep -q healthy; then
              echo "✅ HEALTHY (agents)"
            else
              echo "❌ FAILED (agents)"
              FAILED=1
            fi
            
            echo ""
            echo "🔐 Security Services"
            
            # fail2ban
            echo -n "  fail2ban:   "
            if sudo -n systemctl is-active fail2ban >/dev/null 2>&1; then
              echo "✅ ACTIVE"
            else
              echo "⚠️ INACTIVE (or no sudo)"
            fi
            
            # UFW
            echo -n "  UFW:        "
            if sudo -n ufw status 2>/dev/null | grep -q "Status: active"; then
              echo "✅ ACTIVE"
            else
              echo "⚠️ INACTIVE (or no sudo)"
            fi
            
            echo ""
            echo "========================================"
            if [ $FAILED -eq 0 ]; then
              echo "✅ ALL SMOKE TESTS PASSED"
              echo "Production deployment complete - version ${{ needs.setup.outputs.version }}"
            else
              echo "❌ SOME SMOKE TESTS FAILED"
              echo "Review the failures above and check container logs"
              exit 1
            fi
            echo "========================================"
          ENDSSH

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.setup.outputs.version }}
          name: "Release ${{ needs.setup.outputs.version }}"
          generate_release_notes: true
          draft: false
          prerelease: ${{ !startsWith(needs.setup.outputs.version, 'v1.') }}

  # ===========================================================================
  # JOB 5: Post-Deployment Summary
  # ===========================================================================
  summary:
    name: 📋 Deployment Summary
    runs-on: self-hosted
    needs: [setup, deploy-staging, deploy-production]
    if: always() && (needs.deploy-staging.result == 'success' || needs.deploy-production.result == 'success')

    steps:
      - name: 📋 Generate Summary
        run: |
          echo "## 🚀 Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Environment | ${{ needs.setup.outputs.environment }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Version | ${{ needs.setup.outputs.version }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | ${{ needs.setup.outputs.sha }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### ✅ Deployment Steps Completed" >> $GITHUB_STEP_SUMMARY
          echo "- Configuration files synced" >> $GITHUB_STEP_SUMMARY
          echo "- Docker services deployed" >> $GITHUB_STEP_SUMMARY
          echo "- OpenBao initialized and configured" >> $GITHUB_STEP_SUMMARY
          echo "- Firewall configured" >> $GITHUB_STEP_SUMMARY
          echo "- System configs installed (fail2ban, cron)" >> $GITHUB_STEP_SUMMARY
          echo "- Smoke tests passed" >> $GITHUB_STEP_SUMMARY

  # ===========================================================================
  # JOB 6: Rollback (Manual Trigger Only — requires rollback=true)
  # ===========================================================================
  rollback:
    name: ⏮️ Rollback Deployment
    runs-on: self-hosted
    if: inputs.rollback == true
    environment:
      name: ${{ inputs.environment }}

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup SSH
        run: |
          mkdir -p ~/.ssh
          if [[ "${{ inputs.environment }}" == "production" ]]; then
            echo "${{ secrets.PRODUCTION_SSH_KEY_RESTRICTED }}" > ~/.ssh/deploy_key
            echo "HOST=${{ secrets.PRODUCTION_HOST }}" >> $GITHUB_ENV
            echo "USER=deploy" >> $GITHUB_ENV
          else
            echo "${{ secrets.STAGING_SSH_KEY_RESTRICTED }}" > ~/.ssh/deploy_key
            echo "HOST=${{ secrets.STAGING_HOST }}" >> $GITHUB_ENV
            echo "USER=deploy" >> $GITHUB_ENV
          fi
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H $HOST >> ~/.ssh/known_hosts 2>/dev/null

      - name: ⏮️ Execute Rollback
        run: |
          ssh -i ~/.ssh/deploy_key ${USER}@${HOST} << 'ENDSSH'
            cd /opt/cerniq
            
            echo "========================================"
            echo "  ROLLBACK DEPLOYMENT"
            echo "========================================"
            
            # Check for previous version
            if [ ! -f /opt/cerniq/.previous_deploy ]; then
              echo "❌ No previous deployment found!"
              echo "   Cannot rollback without .previous_deploy file"
              exit 1
            fi
            
            PREV_VERSION=$(cat /opt/cerniq/.previous_deploy)
            if [ -z "$PREV_VERSION" ]; then
              echo "❌ .previous_deploy is empty"
              exit 1
            fi
            echo "📋 Rolling back to: $PREV_VERSION"
            
            echo "🐳 Reverting to previous images..."
            export CERNIQ_VERSION="$PREV_VERSION"
            CERNIQ_VERSION="$PREV_VERSION" docker compose -f docker-compose.yml -f docker-compose.prod.yml pull --ignore-pull-failures || true
            
            # Restart services
            echo "🔄 Restarting services..."
            CERNIQ_VERSION="$PREV_VERSION" docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --force-recreate --remove-orphans

            echo "$PREV_VERSION" > /opt/cerniq/.current_deploy
            
            echo ""
            echo "⏳ Waiting for services..."
            sleep 15
            
            # Verify
            echo ""
            echo "📊 Container Status after rollback:"
            docker ps --format 'table {{.Names}}\t{{.Status}}' | grep cerniq | sort
            
            echo ""
            echo "✅ Rollback complete"
          ENDSSH

      - name: 📋 Generate Rollback Summary
        run: |
          echo "## ⏮️ Rollback Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Environment: ${{ inputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "Triggered by: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
