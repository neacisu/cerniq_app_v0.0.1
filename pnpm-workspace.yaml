packages:
  - apps/*
  - packages/*
  - workers/enrichment
  - workers/shared

# Enforce a reviewed allow/deny policy for every dependency build script.
strictDepBuilds: true
allowBuilds:
  "bcrypt@6.0.0": true
  "cpu-features@0.0.10": false
  "esbuild@0.25.12": true
  "esbuild@0.27.3": true
  "msgpackr-extract@3.0.3": true
  "msw@2.12.10": true
  "protobufjs@7.5.4": true
  "protobufjs@8.0.0": true
  "ssh2@1.17.0": false

storeDir: .pnpm-store
